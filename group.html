<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>목장 나눔 노트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Square:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

  :root{
    /* -- 솔로몬의 편지: 시간대별 하늘/마스트헤드 -- */
    --bg-void:#100e1c;
    --bg-glow:#2c2544;
    --sky-mid:#17132a;
    --star:#f5ecd6;
    --mh-accent:#eccd85;
    --mh-title:#f7efd8;
    --mh-title-glow:rgba(230,190,110,.25);
    --mh-line:rgba(230,190,110,.3);
    --mh-nav-bg:rgba(20,17,34,.6);

    /* -- 목장 나눔 노트 원본 디자인 토큰 (원본과 동일한 값, 이름만 gn- 접두어로 구분) -- */
    --gn-paper: #F6F2EA;
    --gn-paper-line: #E3DCCC;
    --gn-ink: #2C3646;
    --gn-ink-soft: #5B6474;
    --gn-gold: #A9803E;
    --gn-sage: #6F7A5C;
    --gn-rose: #A85C4E;
    --gn-card: #FFFFFF;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0; background:var(--bg-void); color:var(--gn-ink);
    font-family:'Noto Sans KR','Nanum Square',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .sky{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--sky-mid) 55%, var(--bg-glow) 100%);
    transition:background 2s ease;
    pointer-events:none;
  }
  .head-wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:44px 18px 0; }
  .masthead{ text-align:center; color:var(--star); margin-bottom:0; transition:color 2s ease; }
  .eyebrow{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--mh-accent); opacity:.9; margin-bottom:8px; transition:color 2s ease; }
  h1.mh-title{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(28px,6.5vw,40px); margin:0 0 8px; color:var(--mh-title);
    text-shadow:0 0 24px var(--mh-title-glow);
    transition:color 2s ease, text-shadow 2s ease;
  }
  .mh-sub{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:14px; color:var(--mh-accent); opacity:.85; transition:color 2s ease; }
  a.back{
    display:inline-block; margin-top:14px; font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:12.5px; color:var(--mh-accent);
    text-decoration:none; border-bottom:1px solid var(--mh-line);
    transition:color 2s ease, border-color 2s ease;
  }

  /* ============ 아래부터는 원본 "목장 나눔 실시간 노트" 그대로 (색상만 gn- 변수로 치환) ============ */
  .sheet{
    position:relative; z-index:1;
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 22px 100px;
    background: var(--gn-paper);
    color: var(--gn-ink);
  }

  .gn-masthead{
    border-bottom: 1.5px solid var(--gn-ink);
    padding-bottom: 18px;
    margin-bottom: 36px;
  }
  .gn-masthead-top{
    font-size: 13px;
    color: var(--gn-gold);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .title-input{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 27px;
    border: none;
    background: transparent;
    color: var(--gn-ink);
    width: 100%;
    padding: 4px 2px;
    outline: none;
  }
  .title-input::placeholder{ color: #B8AF9C; }
  .title-input:focus{ background: #FFFDF8; border-radius: 3px; }

  .head-actions{
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .head-btn{
    background: none;
    border: 1px solid var(--gn-paper-line);
    color: var(--gn-ink-soft);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 5px;
    cursor: pointer;
  }
  .head-btn:hover{ border-color: var(--gn-gold); color: var(--gn-gold); }
  .head-btn.save{ background: var(--gn-ink); color: #FFFDF8; border-color: var(--gn-ink); }
  .head-btn.save:hover{ background: var(--gn-gold); border-color: var(--gn-gold); color: #fff; }
  .head-btn.save.saved{ background: var(--gn-sage); border-color: var(--gn-sage); }
  .head-status{
    font-size: 12px;
    color: var(--gn-ink-soft);
    align-self: center;
  }
  .conn-status{
    font-size: 12px;
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-block;
  }
  .conn-status.ok{ color: var(--gn-sage); background: #F0F3EC; }
  .conn-status.bad{ color: var(--gn-rose); background: #FBEEEC; }

  .past-banner{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #FBF6EC;
    border: 1px solid #E8D9B8;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 32px;
    font-size: 13.5px;
    color: var(--gn-ink);
  }
  .past-banner .head-btn{ flex: 0 0 auto; white-space: nowrap; }

  .prev-toggle{
    display: inline-block;
    background: none;
    border: none;
    color: var(--gn-ink-soft);
    font-size: 12.5px;
    font-family: 'Noto Sans KR', sans-serif;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 6px 0 0;
  }
  .prev-toggle:hover{ color: var(--gn-gold); }
  .prev-box{
    display: none;
    margin-top: 8px;
    padding: 10px 13px;
    background: #F1EEE4;
    border: 1px solid var(--gn-paper-line);
    border-radius: 4px;
    font-size: 13.5px;
    color: var(--gn-ink-soft);
  }
  .prev-box.open{ display: block; }
  .prev-box .prev-date{
    font-size: 11.5px;
    color: var(--gn-gold);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(44, 54, 70, 0.55);
    z-index: 100;
    padding: 20px;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
  }
  .modal-overlay.open{ display: flex; }
  .modal-box{
    background: var(--gn-paper);
    max-width: 560px;
    width: 100%;
    margin-top: 30px;
    border-radius: 8px;
    padding: 28px 24px;
    position: relative;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .modal-close{
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--gn-ink-soft);
    cursor: pointer;
  }
  .modal-title{
    font-family: 'Noto Serif KR', serif;
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 18px;
    padding-right: 24px;
  }
  .hist-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--gn-paper-line);
  }
  .hist-row:last-child{ border-bottom: none; }
  .hist-date{ font-size: 14.5px; font-weight: 600; }
  .hist-view{
    background: none;
    border: 1px solid var(--gn-paper-line);
    color: var(--gn-ink-soft);
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .hist-view:hover{ border-color: var(--gn-gold); color: var(--gn-gold); }
  .hist-back{
    background: none;
    border: none;
    color: var(--gn-sage);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
    padding: 0;
  }
  .detail-block{ margin-bottom: 20px; }
  .detail-label{ font-size: 12px; color: var(--gn-gold); font-weight: 700; margin-bottom: 6px; }
  .detail-text{ font-size: 14.5px; white-space: pre-wrap; }
  .detail-person{ margin-bottom: 14px; padding-left: 12px; border-left: 2px solid var(--gn-paper-line); }
  .detail-person .name{ font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .detail-comment{ font-size: 13px; color: var(--gn-sage); margin-top: 4px; }
  .empty-note{ font-size: 13.5px; color: var(--gn-ink-soft); padding: 10px 0; }
  .modal-input{
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    color: var(--gn-ink);
    background: #FFFDF8;
    border: 1px solid var(--gn-paper-line);
    border-radius: 5px;
    padding: 10px 12px;
    outline: none;
    margin: 4px 0 4px;
  }
  .modal-input:focus{ border-color: var(--gn-gold); }
  .modal-btn-row{
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-btn-row .head-btn{ flex: 1; text-align: center; }

  section{ margin-bottom: 42px; }

  .sec-label{
    font-size: 13px;
    color: var(--gn-gold);
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .sec-title{
    font-family: 'Noto Serif KR', serif;
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--gn-ink);
  }
  textarea{
    width: 100%;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    color: var(--gn-ink);
    background: var(--gn-card);
    border: 1px solid var(--gn-paper-line);
    border-radius: 4px;
    padding: 14px 16px;
    resize: none;
    overflow: hidden;
    outline: none;
    line-height: 1.7;
    min-height: 46px;
  }
  textarea:focus{ border-color: var(--gn-gold); background: #FFFDF8; }
  textarea::placeholder{ color: #B3ABA0; }

  .sermon-box{ border-left: 3px solid var(--gn-gold); padding-left: 14px; }
  .sermon-box textarea{ min-height: 140px; }
  .reflection-block{ margin-top: 16px; }
  .reflection-label{ font-size: 12px; color: var(--gn-sage); font-weight: 700; margin-bottom: 6px; }
  .reflection-block textarea{ min-height: 70px; border-left: 3px solid var(--gn-sage); padding-left: 13px; }
  .sermon-actions{ margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .summary-result{
    display: none;
    margin-top: 12px;
    padding: 14px 16px;
    background: #FBF8F1;
    border: 1px solid var(--gn-paper-line);
    border-left: 3px solid var(--gn-gold);
    border-radius: 4px;
    font-size: 14px;
    color: var(--gn-ink);
    white-space: pre-wrap;
    line-height: 1.75;
  }
  .summary-result.open{ display: block; }

  .thanks-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }
  .thanks-num{
    flex: 0 0 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--gn-rose);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top: 11px;
  }
  .thanks-row textarea{ flex:1; min-height: 46px; }
  .thanks-del{
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--gn-ink-soft);
    font-size: 18px;
    cursor: pointer;
    margin-top: 8px;
    padding: 4px 6px;
    line-height: 1;
  }
  .thanks-del:hover{ color: var(--gn-rose); }
  .add-btn{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1px dashed var(--gn-paper-line);
    color: var(--gn-ink-soft);
    font-size: 13.5px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 9px 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-btn:hover{ border-color: var(--gn-gold); color: var(--gn-gold); }

  .sv-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .sv-row select, .sv-row input[type="text"]{
    font-family: 'Noto Sans KR', sans-serif; font-size: 13.5px;
    padding: 8px 10px; border: 1px solid var(--gn-paper-line); border-radius: 4px;
    background: var(--gn-card); color: var(--gn-ink);
  }
  .sv-row input[type="text"]{ width: 140px; }
  .sv-row input[type="text"]::placeholder{ color: #B3ABA0; }
  .sv-row select:focus, .sv-row input[type="text"]:focus{ outline: none; border-color: var(--gn-gold); background: #FFFDF8; }
  .sv-remove{
    background: none; border: none; color: var(--gn-ink-soft); font-size: 18px;
    cursor: pointer; padding: 2px 6px; line-height: 1;
  }
  .sv-remove:hover{ color: var(--gn-rose); }
  .sv-rendered{ margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .sv-card{
    background: #FBF8F1; border: 1px solid var(--gn-paper-line); border-left: 3px solid var(--gn-gold);
    border-radius: 4px; padding: 14px 16px;
  }
  .sv-card .sv-ref-label{ font-size: 12.5px; font-weight: 700; color: var(--gn-gold); margin-bottom: 8px; }
  .sv-card .sv-tabs{ display: flex; gap: 6px; margin-bottom: 8px; }
  .sv-card .sv-tab{
    background: none; border: 1px solid var(--gn-paper-line); color: var(--gn-ink-soft);
    border-radius: 999px; font-size: 11px; padding: 3px 10px; cursor: pointer;
  }
  .sv-card .sv-tab.active{ background: var(--gn-gold); color: #fff; border-color: var(--gn-gold); }
  .sv-card .sv-text{ font-size: 14.5px; color: var(--gn-ink); line-height: 1.75; white-space: pre-wrap; }
  .sv-card .sv-error{ font-size: 12.5px; color: var(--gn-rose); }

  .prayer-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .prayer-head .sec-title{ margin-bottom: 0; }
  .copy-btn{
    flex: 0 0 auto;
    background: var(--gn-ink);
    color: #FFFDF8;
    border: none;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .copy-btn:hover{ background: var(--gn-gold); }
  .copy-btn.copied{ background: var(--gn-sage); }

  .prayer-person{
    position: relative;
    padding: 0 0 28px 24px;
    border-left: 1.5px solid var(--gn-paper-line);
  }
  .prayer-person:last-child{ padding-bottom: 0; }
  .prayer-person::before{
    content: '';
    position: absolute;
    left: -6.5px;
    top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--gn-paper);
    border: 2px solid var(--gn-gold);
  }
  .person-name{
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 16px;
    border: none;
    background: transparent;
    color: var(--gn-ink);
    width: 100%;
    padding: 2px 2px 8px;
    outline: none;
    border-bottom: 1px solid var(--gn-paper-line);
    margin-bottom: 10px;
  }
  .person-name::placeholder{ color: #B8AF9C; font-weight: 500; }
  .person-name:focus{ border-color: var(--gn-gold); }
  .person-name[readonly]{ color: var(--gn-gold); cursor: default; }

  .comment-toggle{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--gn-sage);
    font-size: 13px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    padding: 8px 0 0;
  }
  .comment-toggle:hover{ color: var(--gn-gold); }

  .comment-wrap{
    display: none;
    margin-top: 10px;
    padding: 12px 14px;
    background: #F4F6F0;
    border: 1px solid #DCE2D3;
    border-left: 3px solid var(--gn-sage);
    border-radius: 4px;
  }
  .comment-wrap.open{ display: block; }
  .comment-label{
    font-size: 12px;
    color: var(--gn-sage);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .comment-wrap textarea{
    background: #FFFFFF;
    min-height: 40px;
  }

  footer.gn-footer{
    max-width: none;
    margin-top: 50px;
    padding-top: 18px;
    border-top: 1px solid var(--gn-paper-line);
    font-size: 12px;
    color: var(--gn-ink-soft);
    text-align: center;
  }

  @media (max-width: 520px){
    .sheet{ padding: 24px 16px 80px; }
    .title-input{ font-size: 23px; }
  }

  .word-tooltip{
    position:absolute; z-index:9999; max-width:280px; min-width:180px;
    background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); padding:12px 14px;
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .word-tooltip.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .word-tooltip .wt-word{ font-weight:700; font-size:14px; color:var(--ink,#2c2013); margin-bottom:6px; }
  .word-tooltip .wt-body{ font-size:13px; line-height:1.55; color:var(--ink-soft,#6b5636); white-space:pre-wrap; }
  .word-tooltip .wt-badge{ margin-top:8px; font-size:11px; color:var(--gold,#c9a24b); font-weight:600; }
  .word-tooltip .wt-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .word-tooltip .wt-head .wt-word{ margin-bottom:0; }
  .word-tooltip .wt-speak{
    background:transparent; border:1px solid var(--parchment-edge,#d8c69a); border-radius:999px;
    font-size:12px; line-height:1; padding:4px 7px; cursor:pointer; color:var(--cedar,#5b3324); flex:none;
  }
  .word-tooltip .wt-speak:hover{ background:var(--gold,#c9a24b); color:#fff; border-color:var(--gold,#c9a24b); }
  .word-tooltip .wt-speak:disabled{ opacity:.4; cursor:default; }
  .word-tooltip .wt-extra{ margin-top:8px; font-size:12px; color:var(--ink-soft,#6b5636); }
  .word-tooltip .wt-extra .wt-verses{ margin-bottom:4px; }
  .word-tooltip .wt-extra .wt-related div{ margin-bottom:2px; }
  .word-tooltip .wt-extra b{ color:var(--cedar,#5b3324); font-weight:700; }
  .word-tooltip .wt-verse-block{ margin:6px 0; }
  .word-tooltip .wt-verse-block b{ display:block; font-size:11px; color:var(--pomegranate,#8a3b3b); margin-bottom:2px; }
  .word-tooltip .wt-verse-text{ font-size:12px; line-height:1.5; color:var(--ink,#2c2013); padding-left:8px; border-left:2px solid var(--parchment-edge,#d8c69a); }
  .select-menu{
    position:absolute; z-index:10000; background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b);
    border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.3); padding:4px;
    opacity:0; transform:translateY(4px); pointer-events:none; transition:opacity .12s ease, transform .12s ease;
  }
  .select-menu.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .select-menu button{
    display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13px; color:var(--ink,#2c2013);
    padding:8px 14px; border-radius:5px; white-space:nowrap;
  }
  .select-menu button:hover{ background:var(--gold,#c9a24b); color:#fff; }
</style>

<div class="sky"></div>

<div class="head-wrap">
  <div class="masthead">
    <div class="eyebrow">이번 주 목장</div>
    <h1 class="mh-title">목장 나눔 노트</h1>
    <div class="mh-sub">설교 말씀 · 감사 · 기도제목을 함께 나누는 자리</div>
    <a class="back" href="index.html">← 솔로몬의 편지로 돌아가기</a>
  </div>
</div>

<div class="sheet">

<script>
(function(){
  // -- 하늘 배경: 시간대에 맞춰 밤/낮/노을을 보간 (index.html과 동일 로직) --
  function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16), 1]; }
  function rgba(c){
    var m = c.match(/rgba?\(([^)]+)\)/);
    var p = m[1].split(',').map(function(v){ return parseFloat(v); });
    return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
  }
  function parseColor(c){ return c[0] === '#' ? hex(c) : rgba(c); }
  function lerpColor(a, b, t){
    var ca = parseColor(a), cb = parseColor(b);
    var r = ca.map(function(v, i){ return v + (cb[i] - v) * t; });
    return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + (Math.round(r[3] * 1000) / 1000) + ')';
  }
  var NIGHT = {
    bgVoid:'#100e1c', skyMid:'#17132a', bgGlow:'#2c2544', star:'#f5ecd6',
    mhAccent:'#eccd85', mhTitle:'#f7efd8', mhTitleGlow:'rgba(230,190,110,.25)',
    mhLine:'rgba(230,190,110,.3)', mhNavBg:'rgba(20,17,34,.6)', textScheme:'light'
  };
  var DAY = {
    bgVoid:'#5aa8d8', skyMid:'#a9d8ef', bgGlow:'#eef8ff', star:'#33465a',
    mhAccent:'#a9701f', mhTitle:'#233140', mhTitleGlow:'rgba(255,255,255,.5)',
    mhLine:'rgba(169,112,31,.3)', mhNavBg:'rgba(255,255,255,.6)', textScheme:'dark'
  };
  var SUNSET = {
    bgVoid:'#2e2a52', skyMid:'#9c4a72', bgGlow:'#ff9c5c', star:'#fff0dd',
    mhAccent:'#ffb473', mhTitle:'#fff4e2', mhTitleGlow:'rgba(255,140,80,.4)',
    mhLine:'rgba(255,178,120,.35)', mhNavBg:'rgba(40,22,30,.55)', textScheme:'light'
  };
  var WHITE = {
    bgVoid:'#ffffff', skyMid:'#ffffff', bgGlow:'#ffffff', star:'#2b2b2b',
    mhAccent:'#6b6b6b', mhTitle:'#1c1c1c', mhTitleGlow:'rgba(0,0,0,0)',
    mhLine:'rgba(0,0,0,.12)', mhNavBg:'rgba(0,0,0,.04)', textScheme:'dark'
  };
  var KEYS = ['bgVoid','skyMid','bgGlow','star','mhAccent','mhTitle','mhTitleGlow','mhLine','mhNavBg'];
  var TEXT_KEYS = { star:1, mhAccent:1, mhTitle:1, mhTitleGlow:1 };
  var VAR_NAME = {
    bgVoid:'--bg-void', skyMid:'--sky-mid', bgGlow:'--bg-glow', star:'--star',
    mhAccent:'--mh-accent', mhTitle:'--mh-title', mhTitleGlow:'--mh-title-glow',
    mhLine:'--mh-line', mhNavBg:'--mh-nav-bg'
  };
  function applySkyPhase(){
    var d = new Date();
    var h = d.getHours() + d.getMinutes() / 60;
    var wd = d.getDay();
    var isOfficeDay = wd >= 1 && wd <= 4;
    var dayVariant = isOfficeDay ? WHITE : DAY;
    var anchors = [[0,NIGHT],[7,NIGHT],[8,dayVariant],[18,dayVariant],[19,SUNSET],[21,NIGHT],[24,NIGHT]];
    var i = 0;
    while (i < anchors.length - 2 && h >= anchors[i + 1][0]) i++;
    var t = (h - anchors[i][0]) / (anchors[i + 1][0] - anchors[i][0]);
    var a = anchors[i][1], b = anchors[i + 1][1];
    var textT = a.textScheme !== b.textScheme ? (t < 0.5 ? 0 : 1) : t;
    var root = document.documentElement.style;
    KEYS.forEach(function(k){ root.setProperty(VAR_NAME[k], lerpColor(a[k], b[k], TEXT_KEYS[k] ? textT : t)); });
  }
  applySkyPhase();
  setInterval(applySkyPhase, 60 * 1000);
})();
</script>

<script>
  // ============ 아래부터는 원본 "목장 나눔 실시간 노트" 아티팩트의 스크립트 그대로 ============
  // 텍스트에어리어 자동 높이 조절
  function autoGrow(el){
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight) + 'px';
  }
  document.addEventListener('input', function(e){
    if(e.target.tagName === 'TEXTAREA'){ autoGrow(e.target); }
    if(e.target.closest && e.target.closest('.sheet') && !e.target.closest('.modal-box')){
      scheduleAutoSave();
    }
  });

  // 날짜 기본값
  (function setDefaultTitle(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    document.getElementById('titleInput').value = `${y}. ${m}. ${day}.`;
  })();

  // 감사 항목
  let thanksCount = 0;
  function addThanks(){
    thanksCount++;
    const wrap = document.getElementById('thanksList');
    const row = document.createElement('div');
    row.className = 'thanks-row';
    row.innerHTML = `
      <div class="thanks-num">${thanksCount}</div>
      <textarea placeholder="감사한 일을 적어보세요..."></textarea>
      <button class="thanks-del" onclick="removeThanks(this)" aria-label="삭제">×</button>
    `;
    wrap.appendChild(row);
    renumberThanks();
  }
  function removeThanks(btn){
    btn.closest('.thanks-row').remove();
    renumberThanks();
    scheduleAutoSave();
  }
  function renumberThanks(){
    const nums = document.querySelectorAll('#thanksList .thanks-num');
    nums.forEach((el, i) => el.textContent = i + 1);
    thanksCount = nums.length;
  }
  function addThanksAndSave(){
    addThanks();
    scheduleAutoSave();
  }
  addThanks(); // 기본 1개 항목

  // 설교 본문 구절 — 책/장절을 고르면 db에 이미 올려 둔 성경 원문(한글·영어)을 그대로 불러와 보여준다
  const SV_BOOKS = ["창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하","열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언","전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스","오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기","마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서","빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서","야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"];
  const SV_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db') : Promise.resolve(null);
  function svPad(n, w){ n = String(n); while (n.length < w) n = '0' + n; return n; }
  function svParseRef(refText){
    const m = (refText || '').trim().match(/^(\d{1,3})\s*[:장]\s*(\d{1,3})(?:\s*[-~]\s*(\d{1,3}))?\s*(?:절)?\s*$/);
    if (!m) return null;
    const chapter = parseInt(m[1], 10);
    const start = parseInt(m[2], 10);
    const end = m[3] ? parseInt(m[3], 10) : start;
    return { chapter, start, end };
  }
  function svRowsData(){
    return Array.from(document.querySelectorAll('#svRows .sv-row')).map(row => ({
      book: row.querySelector('.sv-book').value,
      ref: row.querySelector('.sv-ref').value.trim()
    })).filter(r => r.ref);
  }
  function addSermonVerseRow(book, ref){
    const wrap = document.getElementById('svRows');
    const row = document.createElement('div');
    row.className = 'sv-row';
    const options = SV_BOOKS.map(b => `<option value="${b}"${b === book ? ' selected' : ''}>${b}</option>`).join('');
    row.innerHTML = `
      <select class="sv-book">${options}</select>
      <input type="text" class="sv-ref" placeholder="예: 119:1-16" value="${(ref || '').replace(/"/g,'&quot;')}">
      <button type="button" class="sv-remove" onclick="removeSermonVerseRow(this)" aria-label="삭제">×</button>
    `;
    wrap.appendChild(row);
  }
  function addSermonVerse(){
    addSermonVerseRow(SV_BOOKS[0], '');
    scheduleAutoSave();
  }
  function removeSermonVerseRow(btn){
    btn.closest('.sv-row').remove();
    renderSermonVerses();
    scheduleAutoSave();
  }
  function resetSermonVerses(){
    document.getElementById('svRows').innerHTML = '';
    addSermonVerseRow(SV_BOOKS[0], '');
    renderSermonVerses();
  }
  function loadSermonVerses(list){
    document.getElementById('svRows').innerHTML = '';
    if (list && list.length) {
      list.forEach(v => addSermonVerseRow(v.book, v.ref));
    } else {
      addSermonVerseRow(SV_BOOKS[0], '');
    }
    renderSermonVerses();
  }
  let svRenderTimer = null;
  function scheduleSvRender(){
    if (svRenderTimer) clearTimeout(svRenderTimer);
    svRenderTimer = setTimeout(renderSermonVerses, 400);
  }
  async function renderSermonVerses(){
    const out = document.getElementById('svRendered');
    const rows = svRowsData();
    if (!rows.length){ out.innerHTML = ''; return; }
    const db = await SV_DB_PROMISE;
    if (!db){ out.innerHTML = '<div class="sv-card"><div class="sv-error">이 화면에서는 성경 본문을 불러올 수 없어요.</div></div>'; return; }
    const cards = await Promise.all(rows.map(async (r) => {
      const idx = SV_BOOKS.indexOf(r.book);
      const parsed = svParseRef(r.ref);
      if (idx === -1 || !parsed) {
        return { error: '형식을 확인해주세요 (예: 119:1-16)', book: r.book, ref: r.ref };
      }
      const docId = svPad(idx + 1, 2) + '-' + svPad(parsed.chapter, 3);
      const [koSnap, enSnap] = await Promise.all([
        db.doc('bible/' + docId).get().catch(() => null),
        db.doc('bible_en/' + docId).get().catch(() => null)
      ]);
      const koData = koSnap && koSnap.exists ? koSnap.data() : null;
      const enData = enSnap && enSnap.exists ? enSnap.data() : null;
      if (!koData) return { error: '해당 본문을 찾지 못했어요.', book: r.book, ref: r.ref };
      const inRange = v => { const n = parseInt(v.n, 10); return n >= parsed.start && n <= parsed.end; };
      const koText = (koData.verses || []).filter(inRange).map(v => v.n + '. ' + v.t).join('\n');
      const enText = enData ? (enData.verses || []).filter(inRange).map(v => v.n + '. ' + v.t).join('\n') : '';
      const label = r.book + ' ' + parsed.chapter + ':' + parsed.start + (parsed.end !== parsed.start ? '-' + parsed.end : '');
      const labelEn = (enData && enData.book_en ? enData.book_en : '') + ' ' + parsed.chapter + ':' + parsed.start + (parsed.end !== parsed.start ? '-' + parsed.end : '');
      return { label, labelEn, koText, enText };
    }));
    out.innerHTML = cards.map((c, i) => {
      if (c.error) {
        return '<div class="sv-card"><div class="sv-ref-label">' + escapeHtml(c.book) + ' ' + escapeHtml(c.ref) + '</div><div class="sv-error">' + escapeHtml(c.error) + '</div></div>';
      }
      return '<div class="sv-card" data-i="' + i + '">' +
        '<div class="sv-ref-label">📖 ' + escapeHtml(c.label) + (c.labelEn ? ' · ' + escapeHtml(c.labelEn) : '') + '</div>' +
        '<div class="sv-tabs"><button type="button" class="sv-tab active" data-lang="ko">한글</button><button type="button" class="sv-tab" data-lang="en">영어</button></div>' +
        '<div class="sv-text sv-ko">' + escapeHtml(c.koText) + '</div>' +
        '<div class="sv-text sv-en" hidden>' + escapeHtml(c.enText || '영어 본문을 찾지 못했어요.') + '</div>' +
        '</div>';
    }).join('');
    out.querySelectorAll('.sv-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = btn.closest('.sv-card');
        card.querySelectorAll('.sv-tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const lang = btn.getAttribute('data-lang');
        card.querySelector('.sv-ko').hidden = lang !== 'ko';
        card.querySelector('.sv-en').hidden = lang !== 'en';
      });
    });
  }
  document.getElementById('svRows').addEventListener('input', scheduleSvRender);
  document.getElementById('svRows').addEventListener('change', scheduleSvRender);
  addSermonVerseRow(SV_BOOKS[0], ''); // 기본 1개 항목

  // 기도제목 — 은아(고정) + 6명 슬롯
  const prayerList = document.getElementById('prayerList');

  // 첫 슬롯: 은아 고정
  const eunaBlock = document.createElement('div');
  eunaBlock.className = 'prayer-person';
  eunaBlock.innerHTML = `
    <input class="person-name" value="은아" readonly>
    <textarea placeholder="기도제목을 적어보세요..."></textarea>
    <div>
      <button class="comment-toggle" onclick="toggleComment(this)">
        <span class="icon">+</span> 목자님 코멘트
      </button>
      <button class="prev-toggle" onclick="togglePrev(this)">지난 주 기도제목 보기</button>
    </div>
    <div class="comment-wrap">
      <div class="comment-label">목자님 코멘트</div>
      <textarea placeholder="코멘트를 적어보세요..."></textarea>
    </div>
    <div class="prev-box"></div>
  `;
  prayerList.appendChild(eunaBlock);

  // 나머지 6명 슬롯
  for(let i = 1; i <= 6; i++){
    const block = document.createElement('div');
    block.className = 'prayer-person';
    block.innerHTML = `
      <input class="person-name" placeholder="이름">
      <textarea placeholder="기도제목을 적어보세요..."></textarea>
      <button class="comment-toggle" onclick="toggleComment(this)">
        <span class="icon">+</span> 목자님 코멘트
      </button>
      <div class="comment-wrap">
        <div class="comment-label">목자님 코멘트</div>
        <textarea placeholder="코멘트를 적어보세요..."></textarea>
      </div>
    `;
    prayerList.appendChild(block);
  }

  loadInitial(); // 마지막으로 저장된 기록 복원 (없으면 빈 상태 유지)
  checkConnection(); // 저장 연결 상태 표시

  async function checkConnection(){
    const el = document.getElementById('connStatus');
    if(!el) return;

    if(!window.claude || typeof window.claude.use !== 'function'){
      el.textContent = '🔴 저장 연결 안 됨 — claude.ai에 로그인한 상태에서 이 페이지를 열어야 자동저장돼요';
      el.classList.add('bad');
      return;
    }

    try{
      const db = await window.claude.use('db');
      if(!db){
        el.textContent = '🔴 저장 기능을 사용할 수 없어요 (권한이 없거나 이 화면에서 지원되지 않아요)';
        el.classList.add('bad');
        return;
      }
      el.textContent = '🟢 자동저장 연결됨';
      el.classList.add('ok');
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }catch(e){
      el.textContent = '🔴 저장 연결 확인에 실패했어요';
      el.classList.add('bad');
    }
  }

  // 마지막으로 저장된 기록을 불러와 화면에 복원
  async function loadInitial(){
    if(!window.claude || typeof window.claude.use !== 'function') return;
    try{
      const weeks = await loadAllWeeks();
      if(weeks && weeks.length){
        populateForm(weeks[0]);
        const status = document.getElementById('saveStatus');
        if(status) status.textContent = '마지막 저장 내용을 불러왔어요';
      }
    }catch(e){ /* 실패하면 빈 상태로 시작 */ }
  }

  function populateForm(data){
    document.getElementById('titleInput').value = data.title || todayString();

    const sermonBox = document.querySelector('.sermon-box textarea');
    sermonBox.value = data.sermon || '';
    autoGrow(sermonBox);

    loadSermonVerses(data.sermonVerses);

    const reflectionBox = document.querySelector('.reflection-text');
    if(reflectionBox){
      reflectionBox.value = data.reflection || '';
      autoGrow(reflectionBox);
    }

    document.getElementById('thanksList').innerHTML = '';
    thanksCount = 0;
    const thanksArr = (data.thanks && data.thanks.length) ? data.thanks : [];
    if(thanksArr.length){
      thanksArr.forEach(t => {
        addThanks();
        const rows = document.querySelectorAll('#thanksList textarea');
        const last = rows[rows.length - 1];
        last.value = t;
        autoGrow(last);
      });
    } else {
      addThanks();
    }

    const persons = document.querySelectorAll('.prayer-person');
    const peopleData = data.people || [];
    const eunaData = peopleData.find(p => (p.name || '').trim() === '은아') || {};
    const others = peopleData.filter(p => p !== eunaData);

    persons.forEach((block, idx) => {
      const pd = idx === 0 ? eunaData : (others[idx - 1] || {});

      if(idx !== 0){ block.querySelector('.person-name').value = pd.name || ''; }

      const prayerBox = block.querySelector('textarea');
      prayerBox.value = pd.prayer || '';
      autoGrow(prayerBox);

      const commentWrap = block.querySelector('.comment-wrap');
      const commentBtn = block.querySelector('.comment-toggle');
      const commentBox = commentWrap.querySelector('textarea');
      if(pd.commentOpen){
        commentWrap.classList.add('open');
        commentBtn.innerHTML = '<span class="icon">−</span> 목자님 코멘트 닫기';
      } else {
        commentWrap.classList.remove('open');
        commentBtn.innerHTML = '<span class="icon">+</span> 목자님 코멘트';
      }
      commentBox.value = pd.comment || '';
      autoGrow(commentBox);

      const prevBox = block.querySelector('.prev-box');
      const prevBtn = block.querySelector('.prev-toggle');
      if(prevBox){ prevBox.classList.remove('open'); prevBox.innerHTML = ''; }
      if(prevBtn){ prevBtn.textContent = '지난 주 기도제목 보기'; }
    });
  }

  function toggleComment(btn){
    const wrap = btn.closest('.prayer-person').querySelector('.comment-wrap');
    const isOpen = wrap.classList.toggle('open');
    btn.innerHTML = isOpen
      ? '<span class="icon">−</span> 목자님 코멘트 닫기'
      : '<span class="icon">+</span> 목자님 코멘트';
    scheduleAutoSave();
  }

  function copyPrayerText(){
    const title = document.getElementById('titleInput').value.trim() || '날짜 미입력';
    let out = `[${title} 기도제목]\n`;

    const people = document.querySelectorAll('.prayer-person');
    people.forEach(p => {
      const name = p.querySelector('.person-name').value.trim();
      const prayerRaw = p.querySelector('textarea').value.trim();
      const commentWrap = p.querySelector('.comment-wrap');
      const commentText = commentWrap.querySelector('textarea').value.trim();
      const commentOpen = commentWrap.classList.contains('open');

      if(!name && !prayerRaw) return;

      out += `\n${name || '(이름 미입력)'}\n`;

      if(prayerRaw){
        prayerRaw.split('\n').forEach(line => {
          if(line.trim()) out += `- ${line.trim()}\n`;
        });
      } else {
        out += `- \n`;
      }

      if(commentOpen && commentText){
        out += `목자님 코멘트: ${commentText}\n`;
      }
    });

    const btn = document.getElementById('copyBtn');
    const finish = () => {
      const original = '기도제목 복사';
      btn.textContent = '복사 완료!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    };

    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out.trim()).then(finish).catch(() => fallbackCopy(out, finish));
    } else {
      fallbackCopy(out, finish);
    }
  }

  function fallbackCopy(text, cb){
    const ta = document.createElement('textarea');
    ta.value = text.trim();
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    if(cb) cb();
  }

  // 설교 말씀 700자 요약
  async function summarizeSermon(){
    const sermonBox = document.querySelector('.sermon-box textarea');
    const noteText = sermonBox.value.trim();
    const btn = document.getElementById('summarizeBtn');
    const resultBox = document.getElementById('summaryResult');

    if(!noteText){
      resultBox.textContent = '먼저 설교 말씀을 적어주세요.';
      resultBox.classList.add('open');
      return;
    }

    if(!window.claude || typeof window.claude.use !== 'function'){
      resultBox.textContent = '이 기능은 Claude 아티팩트 화면에서 열었을 때만 동작해요.';
      resultBox.classList.add('open');
      return;
    }

    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '요약하는 중...';
    resultBox.textContent = '요약하는 중이에요...';
    resultBox.classList.add('open');

    try{
      const sample = await window.claude.use('sample');
      if(!sample){
        resultBox.textContent = '요약 기능을 사용할 수 없어요.';
        return;
      }
      const { text } = await sample(
        `다음은 설교를 들으며 적은 개인 노트야. 이걸 한국어로 700자 내외로 요약해줘. 핵심 메시지와 개인적인 깨달음이 잘 드러나게, 소제목이나 목록 없이 자연스러운 문단으로 써줘.\n\n${noteText}`,
        { modelTier: 'default', onText: ({ text }) => { resultBox.textContent = text; } }
      );
      resultBox.textContent = text.trim();
    }catch(e){
      const messages = {
        not_granted: '요약 기능 사용 권한이 없어요.',
        sampling_disabled: '이 계정에서는 요약 기능을 사용할 수 없어요.',
        rate_limited: '사용량이 많아요. 잠시 후 다시 시도해주세요.',
        prompt_too_large: '내용이 너무 길어요. 조금 줄여서 다시 시도해주세요.',
        empty_completion: '요약을 만들지 못했어요. 다시 시도해주세요.'
      };
      resultBox.textContent = (e && messages[e.code]) || '요약에 실패했어요. 잠시 후 다시 시도해주세요.';
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  }

  function todayString(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}. ${m}. ${day}.`;
  }

  function resetForm(dateStr){
    currentDocId = null;
    liveSnapshot = null;
    hidePastBanner();

    document.getElementById('titleInput').value = dateStr;

    const sermonBox = document.querySelector('.sermon-box textarea');
    sermonBox.value = '';
    autoGrow(sermonBox);
    resetSermonVerses();
    const reflectionBox = document.querySelector('.reflection-text');
    reflectionBox.value = '';
    autoGrow(reflectionBox);
    const summaryResult = document.getElementById('summaryResult');
    summaryResult.textContent = '';
    summaryResult.classList.remove('open');

    document.getElementById('thanksList').innerHTML = '';
    thanksCount = 0;
    addThanks();

    document.querySelectorAll('.prayer-person').forEach((block, idx) => {
      if(idx !== 0){ block.querySelector('.person-name').value = ''; }

      const prayerBox = block.querySelector('textarea');
      prayerBox.value = '';
      autoGrow(prayerBox);

      const commentWrap = block.querySelector('.comment-wrap');
      commentWrap.classList.remove('open');
      block.querySelector('.comment-toggle').innerHTML = '<span class="icon">+</span> 목자님 코멘트';
      const commentBox = commentWrap.querySelector('textarea');
      commentBox.value = '';
      autoGrow(commentBox);

      const prevBox = block.querySelector('.prev-box');
      const prevBtn = block.querySelector('.prev-toggle');
      if(prevBox){ prevBox.classList.remove('open'); prevBox.innerHTML = ''; }
      if(prevBtn){ prevBtn.textContent = '지난 주 기도제목 보기'; }
    });

    document.getElementById('saveStatus').textContent = '';
  }

  function newEntry(){
    const content = document.getElementById('modalContent');
    const today = todayString();
    content.innerHTML = `
      <div class="modal-title">새 기록 만들기</div>
      <div class="empty-note" style="padding-top:0;">지금 화면 내용 중 자동저장되지 않은 부분은 사라져요. 새로 만들 날짜를 입력해주세요.</div>
      <input id="newEntryDateInput" class="modal-input" value="${escapeHtml(today)}" onkeydown="if(event.key==='Enter'){confirmNewEntry();}">
      <div class="modal-btn-row">
        <button class="head-btn" onclick="closeModal()">취소</button>
        <button class="head-btn save" onclick="confirmNewEntry()">새로 만들기</button>
      </div>
    `;
    openModal();
    const input = document.getElementById('newEntryDateInput');
    if(input){ input.focus(); input.select(); }
  }

  function confirmNewEntry(){
    const input = document.getElementById('newEntryDateInput');
    const val = (input && input.value.trim()) || todayString();
    closeModal();
    resetForm(val);
  }

  // ---------- 저장 / 지난 기록 (db 캡퍼빌리티) ----------
  let cachedWeeks = null;
  let currentDocId = null;
  let liveSnapshot = null;

  function slugify(title){
    // 저장 문서 id는 영문/숫자/._-~:@+ 만 허용되고, "."이나 ".."만 남는 것도 안 된다. 날짜
    // ("2026. 09. 25.")처럼 늘 이 글자들로만 이뤄질 걸 가정했던 원본 로직이, 한글이나 다른
    // 기호를 제목으로 적으면 빈 문자열이나 "."만 남아 저장이 조용히 실패하는 문제가 있었다 —
    // 허용되지 않는 글자는 지우고, 글자/숫자가 하나도 안 남으면 타임스탬프로 대체한다.
    const stripped = (title || '').trim().replace(/\s+/g,'').replace(/[^A-Za-z0-9_\-.~:@+]/g, '').slice(0, 150);
    return (stripped && /[A-Za-z0-9]/.test(stripped)) ? stripped : ('untitled-' + Date.now());
  }

  function collectCurrentData(){
    const title = document.getElementById('titleInput').value.trim();
    const sermon = document.querySelector('.sermon-box textarea').value.trim();
    const reflection = document.querySelector('.reflection-text').value.trim();
    const thanks = Array.from(document.querySelectorAll('#thanksList textarea'))
      .map(t => t.value.trim()).filter(v => v);
    const people = Array.from(document.querySelectorAll('.prayer-person')).map(p => {
      const name = p.querySelector('.person-name').value.trim();
      const prayer = p.querySelector('textarea').value.trim();
      const commentWrap = p.querySelector('.comment-wrap');
      const commentOpen = commentWrap.classList.contains('open');
      const comment = commentWrap.querySelector('textarea').value.trim();
      return { name, prayer, comment, commentOpen };
    }).filter(p => p.name || p.prayer);
    const sermonVerses = svRowsData();
    return { title, sermon, sermonVerses, reflection, thanks, people, savedAt: Date.now() };
  }

  let autoSaveTimer = null;
  function scheduleAutoSave(){
    if(autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(autoSaveNow, 1200);
  }

  function timeLabel(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  async function autoSaveNow(){
    const status = document.getElementById('saveStatus');
    const data = collectCurrentData();
    if(!data.title) return;
    if(!window.claude || typeof window.claude.use !== 'function'){
      if(status) status.textContent = '⚠️ 저장 안 됨 (연결 문제)';
      return;
    }

    if(status) status.textContent = '저장 중...';
    try{
      const db = await window.claude.use('db');
      if(!db){ if(status) status.textContent = '⚠️ 저장 안 됨 (권한 없음)'; return; }
      const id = currentDocId || slugify(data.title);
      await db.collection('weeks').doc(id).set(data);
      currentDocId = id; // 이번 편집 세션 동안은 같은 문서에 계속 덮어쓴다 (제목을 나중에 고쳐도 문서가 갈라지지 않도록)
      cachedWeeks = null;
      if(status) status.textContent = `자동 저장됨 · ${timeLabel()}`;
    }catch(e){
      if(status) status.textContent = '⚠️ 자동 저장 실패';
    }
  }

  async function loadAllWeeks(){
    if(cachedWeeks !== null) return cachedWeeks;
    if(!window.claude || typeof window.claude.use !== 'function'){ cachedWeeks = []; return cachedWeeks; }
    try{
      const db = await window.claude.use('db');
      if(!db){ cachedWeeks = []; return cachedWeeks; }
      const snap = await db.collection('weeks').orderBy('savedAt', 'desc').limit(50).get();
      cachedWeeks = snap.docs
        .map(d => { const body = d.data(); return body ? { ...body, _id: d.id } : null; })
        .filter(Boolean);
    }catch(e){
      cachedWeeks = [];
    }
    return cachedWeeks;
  }

  function openModal(){ document.getElementById('modalOverlay').classList.add('open'); }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
  function closeModalOnOverlay(e){ if(e.target.id === 'modalOverlay'){ closeModal(); } }

  async function openHistory(){
    const content = document.getElementById('modalContent');
    content.innerHTML = '<div class="modal-title">지난 기록</div><div class="empty-note">불러오는 중...</div>';
    openModal();
    const weeks = await loadAllWeeks();
    renderHistoryListHTML(weeks);
  }

  function renderHistoryListHTML(weeks){
    const content = document.getElementById('modalContent');
    if(!weeks.length){
      content.innerHTML = '<div class="modal-title">지난 기록</div><div class="empty-note">아직 저장된 기록이 없어요. "이번 주 기록 저장"을 눌러 남겨보세요.</div>';
      return;
    }
    let html = '<div class="modal-title">지난 기록</div>';
    weeks.forEach((w, idx) => {
      html += `
        <div class="hist-row">
          <div class="hist-date">${escapeHtml(w.title || '(제목 없음)')}</div>
          <button class="hist-view" onclick="openPastEntry(${idx})">열어서 수정</button>
        </div>`;
    });
    content.innerHTML = html;
  }

  async function openPastEntry(idx){
    const weeks = await loadAllWeeks();
    const w = weeks[idx];
    if(!w) return;

    if(currentDocId === null){
      liveSnapshot = collectCurrentData();
    }
    currentDocId = w._id || slugify(w.title || '');
    populateForm(w);
    closeModal();
    showPastBanner(w.title);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showPastBanner(title){
    const banner = document.getElementById('pastBanner');
    const label = document.getElementById('pastBannerTitle');
    if(label) label.textContent = title || '';
    if(banner) banner.style.display = 'flex';
  }

  function hidePastBanner(){
    const banner = document.getElementById('pastBanner');
    if(banner) banner.style.display = 'none';
  }

  function exitPastView(){
    currentDocId = null;
    if(liveSnapshot){
      populateForm(liveSnapshot);
      liveSnapshot = null;
    }
    hidePastBanner();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escapeHtml(str){
    if(!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  async function togglePrev(btn){
    const block = btn.closest('.prayer-person');
    const box = block.querySelector('.prev-box');

    if(box.classList.contains('open')){
      box.classList.remove('open');
      btn.textContent = '지난 기록 보기';
      return;
    }

    const name = block.querySelector('.person-name').value.trim();
    if(!name){
      box.innerHTML = `<div class="prev-date">알림</div>이름을 먼저 입력해주세요.`;
      box.classList.add('open');
      return;
    }

    box.innerHTML = `불러오는 중...`;
    box.classList.add('open');
    btn.textContent = '지난 기록 닫기';

    const currentTitle = document.getElementById('titleInput').value.trim();
    const weeks = await loadAllWeeks();
    const match = weeks.find(w =>
      w.title !== currentTitle &&
      w.people && w.people.some(p => p.name.trim() === name && p.prayer)
    );

    if(!match){
      box.innerHTML = `<div class="prev-date">이전 기록 없음</div>'${escapeHtml(name)}'님의 지난 기도제목을 찾지 못했어요.`;
      return;
    }

    const p = match.people.find(p => p.name.trim() === name && p.prayer);
    box.innerHTML = `<div class="prev-date">${escapeHtml(match.title)}</div>${escapeHtml(p.prayer)}`
      + (p.commentOpen && p.comment ? `<div class="detail-comment" style="margin-top:6px;">목자님 코멘트: ${escapeHtml(p.comment)}</div>` : '');
  }
</script>


<script>
(function(){
  if (window.__wordTooltipInit) return;

  var BOOK_INDEX = {"창세기":1, "출애굽기":2, "레위기":3, "민수기":4, "신명기":5, "여호수아":6, "사사기":7, "룻기":8, "사무엘상":9, "사무엘하":10, "열왕기상":11, "열왕기하":12, "역대상":13, "역대하":14, "에스라":15, "느헤미야":16, "에스더":17, "욥기":18, "시편":19, "잠언":20, "전도서":21, "아가":22, "이사야":23, "예레미야":24, "예레미야애가":25, "에스겔":26, "다니엘":27, "호세아":28, "요엘":29, "아모스":30, "오바댜":31, "요나":32, "미가":33, "나훔":34, "하박국":35, "스바냐":36, "학개":37, "스가랴":38, "말라기":39, "마태복음":40, "마가복음":41, "누가복음":42, "요한복음":43, "사도행전":44, "로마서":45, "고린도전서":46, "고린도후서":47, "갈라디아서":48, "에베소서":49, "빌립보서":50, "골로새서":51, "데살로니가전서":52, "데살로니가후서":53, "디모데전서":54, "디모데후서":55, "디도서":56, "빌레몬서":57, "히브리서":58, "야고보서":59, "베드로전서":60, "베드로후서":61, "요한일서":62, "요한이서":63, "요한삼서":64, "유다서":65, "요한계시록":66};

  var SAMPLE_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('sample')
    : Promise.resolve(null);
  var VOCAB_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  function speakKorean(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function escHtml(s){
    return String(s || '').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
  }
  function pad(n, w){ n = String(n); while (n.length < w) n = '0' + n; return n; }
  function chapterDocId(book, chapter){
    var num = BOOK_INDEX[book];
    if (!num) return null;
    return pad(num, 2) + '-' + pad(chapter, 3);
  }
  function resolveVerses(db, refs){
    if (!db || !refs || !refs.length) return Promise.resolve([]);
    return Promise.all(refs.map(function(ref){
      var docId = chapterDocId(ref.book, ref.chapter);
      if (!docId) return null;
      return db.doc('bible/' + docId).get().then(function(snap){
        if (!snap.exists) return null;
        var data = snap.data();
        var start = ref.start || 1;
        var end = ref.end || start;
        var matched = (data.verses || []).filter(function(v){
          var n = parseInt(v.n, 10);
          return n >= start && n <= end;
        });
        if (!matched.length) return null;
        var label = ref.book + ' ' + ref.chapter + ':' + start + (end !== start ? '-' + end : '');
        var text = matched.map(function(v){ return v.n + '. ' + v.t; }).join(' ');
        return { label: label, text: text };
      }).catch(function(){ return null; });
    })).then(function(results){ return results.filter(Boolean); });
  }

  var tooltipEl = null;
  function ensureTooltip(){
    if (tooltipEl) return tooltipEl;
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    tooltipEl.innerHTML = '<div class="wt-head"><span class="wt-word"></span><button type="button" class="wt-speak" title="발음 듣기">\ud83d\udd0a</button></div><div class="wt-body"></div><div class="wt-extra"></div><div class="wt-badge" hidden></div>';
    document.body.appendChild(tooltipEl);
    tooltipEl.querySelector('.wt-speak').addEventListener('click', function(){
      speakKorean(tooltipEl.querySelector('.wt-word').textContent);
    });
    return tooltipEl;
  }
  function hideTooltip(){ if (tooltipEl) tooltipEl.classList.remove('open'); }
  function positionTooltip(rect){
    var el = ensureTooltip();
    var top = window.scrollY + rect.bottom + 8;
    var left = window.scrollX + rect.left;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 16;
    if (left > maxLeft) left = Math.max(12, maxLeft);
    if (left < 12) left = 12;
    el.style.top = top + 'px';
    el.style.left = left + 'px';
  }
  function vocabKey(word){ return 'vocab/' + encodeURIComponent(word); }
  function renderExtra(el, entry){
    var parts = [];
    if (entry.verses && entry.verses.length){
      var vRows = entry.verses.map(function(vb){

      }).join('');
      parts.push('<div class="wt-verses">\ud83d\udcd6 관련 구절' + vRows + '</div>');

      var rows = entry.related.map(function(r2){
        return '<div>· <b>' + escHtml(r2.word) + '</b>' + (r2.nuance ? ' — ' + escHtml(r2.nuance) : '') + '</div>';

  }
  function lookupWord(word){
    return VOCAB_DB_PROMISE.then(function(db){
      if (!db) return { db: null, hit: null };
      return db.doc(vocabKey(word)).get().then(function(snap){
        return { db: db, hit: (snap && snap.exists) ? snap.data() : null };
      }).catch(function(){ return { db: db, hit: null }; });
    }).then(function(r){
      if (r.hit) return Object.assign({ cached: true }, r.hit);

        if (!sample) return null;
        return sample.json(
          '아래 한국어 단어 또는 구절을 성경 본문에서 만났다. 다음 JSON 형식으로만 답해라(다른 설명 없이):\n' +
          '{"definition": "2~3문장의 기본 뜻, 신앙·성경 맥락 고려, 인사말 없이", "verses": [{"book": "사도행전", "chapter": 16, "start": 31, "end": 34}], "related": [{"word": "비슷한 뜻이지만 뉘앙스가 다른 단어", "nuance": "그 차이를 1문장으로"}]}\n' +
          'verses의 book은 정확한 개역한글 성경 책 이름 하나(창세기~요한계시록 중), chapter/start/end는 숫자. 이 단어와 실제로 관련 있는 구절 1~2개만 골라라. 원어(히브리어/헬라어)나 번역에 따라 뜻이 갈리는 지점이 있으면 definition이나 nuance에 녹여라. related는 뜻은 비슷하지만 결이 다른 단어 0~3개, 없으면 빈 배열.\n\n단어: ' + word,
          { modelTier: 'quick' }
        ).then(function(data){
          var definition = String((data && data.definition) || '').trim();
          var refs = Array.isArray(data && data.verses) ? data.verses.filter(function(v){
            return v && v.book && BOOK_INDEX[v.book] && v.chapter;
          }).map(function(v){
            return { book: String(v.book), chapter: Number(v.chapter), start: Number(v.start || 1), end: Number(v.end || v.start || 1) };
          }) : [];
          var related = Array.isArray(data && data.related)
            ? data.related.filter(function(r2){ return r2 && r2.word; }).map(function(r2){ return { word: String(r2.word), nuance: String(r2.nuance || '') }; })
            : [];
          return resolveVerses(r.db, refs).then(function(verseBlocks){
            var entry = { word: word, definition: definition, verses: verseBlocks, related: related, createdAt: Date.now(), box: 1, nextReview: Date.now() };
            if (r.db){ r.db.doc(vocabKey(word)).set(entry).catch(function(){}); }
            return Object.assign({ cached: false }, entry);
          });
        });
      });
    });
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  var pending = 0;
  function handleSelection(){
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text || text.length < 1 || text.length > 30 || text.indexOf('\n') !== -1){ hideTooltip(); return; }
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (isInsideFormField(range.commonAncestorContainer)){ hideTooltip(); return; }
    var rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    var el = ensureTooltip();
    el.querySelector('.wt-word').textContent = text;
    el.querySelector('.wt-body').textContent = '뜻을 찾는 중...';
    el.querySelector('.wt-extra').innerHTML = '';
    var badge = el.querySelector('.wt-badge');
    badge.hidden = true;
    el.classList.add('open');
    positionTooltip(rect);

    var myTicket = ++pending;
    lookupWord(text).then(function(result){
      if (myTicket !== pending) return;
      if (!result){
        el.querySelector('.wt-body').textContent = '이 기능은 Claude 아티팩트 화면에서만 동작해요.';
        return;
      }
      el.querySelector('.wt-body').textContent = result.definition;
      renderExtra(el.querySelector('.wt-extra'), result);
      badge.hidden = false;
      badge.className = 'wt-badge' + (result.cached ? ' cached' : '');
      badge.textContent = result.cached ? '⚡ 단어장에서 바로 불러왔어요 (무료)' : '✓ 단어장에 저장했어요';
    }).catch(function(){
      if (myTicket !== pending) return;
      el.querySelector('.wt-body').textContent = '뜻을 가져오지 못했어요.';
    });
  }
  document.addEventListener('mouseup', function(e){
    if (e.button !== 0) return;
    if (e.target && e.target.closest && (e.target.closest('.word-tooltip') || e.target.closest('.select-menu'))) return;
    setTimeout(handleSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!(e.target && e.target.closest && e.target.closest('.word-tooltip'))) hideTooltip();
  });
  document.addEventListener('scroll', hideTooltip, true);
})();
</script>


<script>
(function(){
  if (window.__quoteSaveInit) return;
  window.__quoteSaveInit = true;

  var QUOTES_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  var menuEl = null;
  function ensureMenu(){
    if (menuEl) return menuEl;
    menuEl = document.createElement('div');
    menuEl.className = 'select-menu';
    menuEl.innerHTML = '<button type="button" class="sm-save">\ud83d\udccc 이 구절 저장하기</button>';
    document.body.appendChild(menuEl);
    return menuEl;
  }
  function hideMenu(){ if (menuEl) menuEl.classList.remove('open'); }
  function captureBibleRef(sel){
    try {
      if (!sel || !sel.rangeCount) return null;
      var range = sel.getRangeAt(0);
      var anchor = sel.anchorNode;
      var anchorEl = anchor && anchor.nodeType === 1 ? anchor : (anchor ? anchor.parentElement : null);
      var dayEl = anchorEl && anchorEl.closest ? anchorEl.closest('.reading-day') : null;
      if (!dayEl) return null;
      var bookKr = dayEl.getAttribute('data-book-kr');
      var bookEn = dayEl.getAttribute('data-book-en');
      var chapter = dayEl.getAttribute('data-chapter');
      if (!bookKr || !chapter) return null;
      var verses = [];
      dayEl.querySelectorAll('.rv[data-verse]').forEach(function(rv){
        if (!range.intersectsNode(rv)) return;
        var koEl = rv.querySelector('.ko');
        var enEl = rv.querySelector('.en');
        verses.push({
          n: parseInt(rv.getAttribute('data-verse'), 10) || 0,
          ko: koEl ? koEl.textContent.replace(/^\s*\d+\s*/, '').trim() : '',
          en: enEl ? enEl.textContent.trim() : ''
        });
      });
      if (!verses.length) return null;
      verses.sort(function(a,b){ return a.n - b.n; });
      var vMin = verses[0].n, vMax = verses[verses.length - 1].n;
      return {
        bookKr: bookKr,
        bookEn: bookEn,
        chapter: parseInt(chapter, 10),
        verseStart: vMin,
        verseEnd: vMax,
        label: bookKr + ' ' + chapter + '\uc7a5 ' + vMin + (vMax > vMin ? '-' + vMax : '') + '\uc808',
        labelEn: (bookEn || '') + ' ' + chapter + ':' + vMin + (vMax > vMin ? '-' + vMax : ''),
        koText: verses.map(function(v){ return v.n + '. ' + v.ko; }).join('\n'),
        enText: verses.map(function(v){ return v.n + '. ' + v.en; }).join('\n')
      };
    } catch (err) { return null; }
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  function positionMenu(menu, x, y){
    var maxLeft = window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8;
    var left = Math.min(x, Math.max(8, maxLeft));
    menu.style.left = left + 'px';
    menu.style.top = y + 'px';
  }
  function saveQuote(text, btn, bibleRef){
    QUOTES_DB_PROMISE.then(function(db){
      if (!db) return;
      var id = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      var entry = {
        text: text,
        source: (document.title || '').replace(/\s+/g, ' ').trim(),
        createdAt: Date.now()
      };
      if (bibleRef) entry.bibleRef = bibleRef;
      db.doc('quotes/' + id).set(entry).then(function(){
        document.dispatchEvent(new CustomEvent('solomon-quote-saved', { detail: entry }));
      }).catch(function(){});
    });
    if (btn) btn.textContent = '\u2713 저장했어요';
    setTimeout(hideMenu, 700);
  }
  document.addEventListener('contextmenu', function(e){
    if (isInsideFormField(e.target)) return;
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text) { hideMenu(); return; }
    e.preventDefault();
    var bibleRef = captureBibleRef(sel);
    var menu = ensureMenu();
    var btn = menu.querySelector('.sm-save');
    btn.textContent = '\ud83d\udccc 이 구절 저장하기';
    menu.classList.add('open');
    positionMenu(menu, window.scrollX + e.clientX, window.scrollY + e.clientY);
    btn.onclick = function(){ saveQuote(text, btn, bibleRef); };
  });
  document.addEventListener('click', function(e){
    if (menuEl && !(e.target.closest && e.target.closest('.select-menu'))) hideMenu();
  });
  document.addEventListener('scroll', hideMenu, true);
})();
</script>


<style>
  .scroll-top-btn{
    position:fixed; right:18px; bottom:18px; z-index:9998;
    width:44px; height:44px; border-radius:50%;
    background:var(--cedar,#5b3324); color:#f7efd8; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.35);
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .2s ease, transform .2s ease, background .2s ease;
  }
  .scroll-top-btn.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .scroll-top-btn:hover{ background:var(--gold,#c9a24b); }
  .scroll-top-btn svg{ width:20px; height:20px; }
  @media (max-width:480px){ .scroll-top-btn{ right:14px; bottom:14px; width:40px; height:40px; } }
</style>
<script>
(function(){
  if (window.__scrollTopInit) return;
  window.__scrollTopInit = true;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'scroll-top-btn';
  btn.setAttribute('aria-label', '\ub9e8 \uc704\ub85c');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  document.body.appendChild(btn);
  function update(){
    if (window.scrollY > 320) btn.classList.add('show'); else btn.classList.remove('show');
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
  btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
