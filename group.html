<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>목장 나눔 노트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Square:wght@400;700;800&display=swap');

  :root{
    --bg-void:#100e1c;
    --bg-glow:#2c2544;
    --sky-mid:#17132a;
    --gold:#c9a24b;
    --gold-bright:#eccd85;
    --parchment:#ecdfc2;
    --parchment-edge:#d8c69a;
    --ink:#2c2013;
    --ink-soft:#6b5636;
    --cedar:#5b3324;
    --pomegranate:#8a3b3b;
    --star:#f5ecd6;
    --mh-accent:#eccd85;
    --mh-title:#f7efd8;
    --mh-title-glow:rgba(230,190,110,.25);
    --mh-line:rgba(230,190,110,.3);
    --mh-nav-bg:rgba(20,17,34,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0; background:var(--bg-void); color:var(--ink);
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .sky{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--sky-mid) 55%, var(--bg-glow) 100%);
    transition:background 2s ease;
    pointer-events:none;
  }
  .wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:44px 18px 70px; }

  .masthead{ text-align:center; color:var(--star); margin-bottom:28px; transition:color 2s ease; }
  .eyebrow{ font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--mh-accent); opacity:.9; margin-bottom:8px; transition:color 2s ease; }
  h1.title{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(28px,6.5vw,40px); margin:0 0 8px; color:var(--mh-title);
    text-shadow:0 0 24px var(--mh-title-glow);
    transition:color 2s ease, text-shadow 2s ease;
  }
  .sub{ font-size:14px; color:var(--mh-accent); opacity:.85; transition:color 2s ease; }
  a.back{
    display:inline-block; margin-top:14px; font-size:12.5px; color:var(--mh-accent);
    text-decoration:none; border-bottom:1px solid var(--mh-line);
    transition:color 2s ease, border-color 2s ease;
  }

  .scroll{
    position:relative; background:var(--parchment); color:var(--ink);
    padding:36px clamp(20px,6vw,48px) 32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    transition:background-color 1.5s ease;
  }

  .kicker{ font-size:12px; letter-spacing:.28em; font-weight:600; color:var(--pomegranate); margin-bottom:8px; }
  h2{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-weight:400; font-size:clamp(22px,4.4vw,28px); margin:0 0 18px; color:var(--cedar); }

  .journal .field-label{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:11.5px; letter-spacing:.15em;
    color:var(--ink-soft); font-weight:600; margin:18px 0 8px;
  }
  .journal .field-label:first-of-type{ margin-top:0; }
  .journal input[type=text]{
    width:100%; font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:15px;
    padding:12px 14px; border:1px solid var(--parchment-edge); background:#f7f1de; color:var(--ink);
  }
  .journal input[type=text]:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .journal textarea{
    width:100%; min-height:90px; resize:vertical;
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:15.5px; line-height:1.75; color:var(--ink);
    background:#f7f1de; border:1px solid var(--parchment-edge);
    padding:14px 16px;
  }
  .journal textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .journal-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:22px; }
  .journal button{
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    font-size:13.5px; letter-spacing:.05em; font-weight:500;
    background:var(--cedar); color:#f7efd8; border:none;
    padding:10px 20px; cursor:pointer;
  }
  .journal button:hover{ background:#4a2a1d; }
  .journal .status{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:12.5px; color:var(--ink-soft); }

  footer{
    max-width:720px; margin:30px auto 0; padding-inline:18px; text-align:center;
    color:var(--mh-accent); opacity:.7; font-size:12px; position:relative; z-index:1;
    transition:color 2s ease;
  }

  @media (max-width:480px){ .scroll{ padding-inline:20px; } }
</style>

<div class="sky"></div>

<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">이번 주 목장</div>
    <h1 class="title">목장 나눔 노트</h1>
    <div class="sub" id="weekLabel"></div>
    <a class="back" href="index.html">← 솔로몬의 편지로 돌아가기</a>
  </div>

  <div class="scroll">
    <div class="kicker">나눔 기록</div>
    <h2>이번 주 목장 나눔</h2>

    <div class="journal">
      <div class="field-label">나눔 제목</div>
      <input type="text" id="gnTitle" placeholder="예: 9월 셋째 주 목장 모임">

      <div class="field-label">설교 요약</div>
      <textarea id="gnSermon" placeholder="이번 주 들은 설교의 핵심을 적어 보라..."></textarea>

      <div class="field-label">나눔 · 묵상</div>
      <textarea id="gnReflection" placeholder="목장에서 나눈 이야기, 마음에 남은 것을 적어 보라..."></textarea>

      <div class="field-label">감사</div>
      <textarea id="gnThanks" placeholder="이번 주 감사한 일을 적어 보라..."></textarea>

      <div class="field-label">기도제목</div>
      <textarea id="gnPrayer" placeholder="이번 주 나의 기도제목을 적어 보라..."></textarea>

      <div class="journal-row">
        <button id="gnSave" type="button">이번 주 나눔 저장하기</button>
        <span class="status" id="gnStatus"></span>
      </div>
    </div>
  </div>
</div>

<footer>나눔 기록은 이 브라우저에만 저장됩니다</footer>

<script>
(function(){
  // -- 하늘 배경: 시간대에 맞춰 밤/낮/노을을 보간 (index.html과 동일 로직) --
  (function(){
    function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16), 1]; }
    function rgba(c){
      var m = c.match(/rgba?\(([^)]+)\)/);
      var p = m[1].split(',').map(function(v){ return parseFloat(v); });
      return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
    }
    function parseColor(c){ return c[0] === '#' ? hex(c) : rgba(c); }
    function lerpColor(a, b, t){
      var ca = parseColor(a), cb = parseColor(b);
      var r = ca.map(function(v, i){ return v + (cb[i] - v) * t; });
      return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + (Math.round(r[3] * 1000) / 1000) + ')';
    }
    var NIGHT = {
      bgVoid:'#100e1c', skyMid:'#17132a', bgGlow:'#2c2544', star:'#f5ecd6',
      mhAccent:'#eccd85', mhTitle:'#f7efd8', mhTitleGlow:'rgba(230,190,110,.25)',
      mhLine:'rgba(230,190,110,.3)', mhNavBg:'rgba(20,17,34,.6)'
    };
    var DAY = {
      bgVoid:'#5aa8d8', skyMid:'#a9d8ef', bgGlow:'#eef8ff', star:'#33465a',
      mhAccent:'#a9701f', mhTitle:'#233140', mhTitleGlow:'rgba(255,255,255,.5)',
      mhLine:'rgba(169,112,31,.3)', mhNavBg:'rgba(255,255,255,.6)'
    };
    var SUNSET = {
      bgVoid:'#2e2a52', skyMid:'#9c4a72', bgGlow:'#ff9c5c', star:'#fff0dd',
      mhAccent:'#ffb473', mhTitle:'#fff4e2', mhTitleGlow:'rgba(255,140,80,.4)',
      mhLine:'rgba(255,178,120,.35)', mhNavBg:'rgba(40,22,30,.55)'
    };
    // 월~목 08~18시 "위장 모드" — 회사에서 볼 때 티나지 않도록 낮 하늘을 새하얗게
    var WHITE = {
      bgVoid:'#ffffff', skyMid:'#ffffff', bgGlow:'#ffffff', star:'#2b2b2b',
      mhAccent:'#6b6b6b', mhTitle:'#1c1c1c', mhTitleGlow:'rgba(0,0,0,0)',
      mhLine:'rgba(0,0,0,.12)', mhNavBg:'rgba(0,0,0,.04)'
    };
    var KEYS = Object.keys(NIGHT);
    var VAR_NAME = {
      bgVoid:'--bg-void', skyMid:'--sky-mid', bgGlow:'--bg-glow', star:'--star',
      mhAccent:'--mh-accent', mhTitle:'--mh-title', mhTitleGlow:'--mh-title-glow',
      mhLine:'--mh-line', mhNavBg:'--mh-nav-bg'
    };
    function applySkyPhase(){
      var d = new Date();
      var h = d.getHours() + d.getMinutes() / 60;
      var wd = d.getDay();
      var isOfficeDay = wd >= 1 && wd <= 4;
      var dayVariant = isOfficeDay ? WHITE : DAY;
      var anchors = [[0,NIGHT],[7,NIGHT],[8,dayVariant],[18,dayVariant],[19,SUNSET],[21,NIGHT],[24,NIGHT]];
      var i = 0;
      while (i < anchors.length - 2 && h >= anchors[i + 1][0]) i++;
      var t = (h - anchors[i][0]) / (anchors[i + 1][0] - anchors[i][0]);
      var a = anchors[i][1], b = anchors[i + 1][1];
      var root = document.documentElement.style;
      KEYS.forEach(function(k){ root.setProperty(VAR_NAME[k], lerpColor(a[k], b[k], t)); });
      var officeWhite = isOfficeDay && h >= 8 && h < 18;
      root.setProperty('--parchment', officeWhite ? '#ffffff' : '#ecdfc2');
      root.setProperty('--parchment-edge', officeWhite ? '#eeeeee' : '#d8c69a');
    }
    applySkyPhase();
    setInterval(applySkyPhase, 60 * 1000);
  })();

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function weekStartKey(d){
    var sunday = new Date(d);
    sunday.setDate(d.getDate() - d.getDay());
    return dateKey(sunday);
  }

  var now = new Date();
  var wk = weekStartKey(now);
  var wkDate = new Date(wk.split('-').map(Number)[0], wk.split('-').map(Number)[1]-1, wk.split('-').map(Number)[2]);

  var weekLabelEl = document.getElementById('weekLabel');
  if (weekLabelEl) weekLabelEl.textContent = (wkDate.getMonth()+1) + '월 ' + wkDate.getDate() + '일 시작 주';

  var GN_KEY = 'solomonSermonNotes';
  function loadNotes(){
    try { return JSON.parse(localStorage.getItem(GN_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveNotes(map){
    try { localStorage.setItem(GN_KEY, JSON.stringify(map)); } catch (e) {}
  }

  var notes = loadNotes();
  var fields = {
    title: document.getElementById('gnTitle'),
    sermon: document.getElementById('gnSermon'),
    reflection: document.getElementById('gnReflection'),
    thanks: document.getElementById('gnThanks'),
    prayer: document.getElementById('gnPrayer')
  };
  var statusEl = document.getElementById('gnStatus');

  var entry = notes[wk];
  if (entry) {
    Object.keys(fields).forEach(function(k){ if (fields[k]) fields[k].value = entry[k] || ''; });
    if (statusEl) statusEl.textContent = '이번 주 나눔이 이미 기록되어 있습니다. 다시 저장하면 덮어씁니다.';
  }

  var saveBtn = document.getElementById('gnSave');
  if (saveBtn) {
    saveBtn.addEventListener('click', function(){
      var next = { ts: new Date().toISOString() };
      Object.keys(fields).forEach(function(k){ next[k] = fields[k] ? fields[k].value : ''; });
      notes[wk] = next;
      saveNotes(notes);
      if (statusEl) {
        var d = new Date();
        statusEl.textContent = '저장되었습니다 · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
    });
  }
})();
</script>

</body></html>
