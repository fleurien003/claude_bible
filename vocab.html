<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>나의 단어장</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Square:wght@400;700;800&display=swap');

  :root{
    --bg-void:#100e1c;
    --bg-glow:#2c2544;
    --sky-mid:#17132a;
    --gold:#c9a24b;
    --gold-bright:#eccd85;
    --parchment:#ecdfc2;
    --parchment-edge:#d8c69a;
    --ink:#2c2013;
    --ink-soft:#6b5636;
    --cedar:#5b3324;
    --pomegranate:#8a3b3b;
    --star:#f5ecd6;
    --mh-accent:#eccd85;
    --mh-title:#f7efd8;
    --mh-title-glow:rgba(230,190,110,.25);
    --mh-line:rgba(230,190,110,.3);
    --mh-nav-bg:rgba(20,17,34,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0; background:var(--bg-void); color:var(--ink);
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .sky{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--sky-mid) 55%, var(--bg-glow) 100%);
    transition:background 2s ease;
    pointer-events:none;
  }
  .wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:44px 18px 70px; }

  .masthead{ text-align:center; color:var(--star); margin-bottom:28px; transition:color 2s ease; }
  .eyebrow{ font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--mh-accent); opacity:.9; margin-bottom:8px; transition:color 2s ease; }
  h1.title{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(28px,6.5vw,40px); margin:0 0 8px; color:var(--mh-title);
    text-shadow:0 0 24px var(--mh-title-glow);
    transition:color 2s ease, text-shadow 2s ease;
  }
  .sub{ font-size:14px; color:var(--mh-accent); opacity:.85; transition:color 2s ease; }
  a.back{
    display:inline-block; margin-top:14px; font-size:12.5px; color:var(--mh-accent);
    text-decoration:none; border-bottom:1px solid var(--mh-line);
    transition:color 2s ease, border-color 2s ease;
  }

  .scroll{
    position:relative; background:var(--parchment); color:var(--ink);
    padding:36px clamp(20px,6vw,48px) 32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    transition:background-color 1.5s ease;
  }

  .kicker{ font-size:12px; letter-spacing:.28em; font-weight:600; color:var(--pomegranate); margin-bottom:8px; }
  h2{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-weight:400; font-size:clamp(22px,4.4vw,28px); margin:0 0 18px; color:var(--cedar); }

  .search-row{ margin-bottom:20px; }
  .search-row input{
    width:100%; font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:15px;
    padding:11px 14px; border:1px solid var(--parchment-edge); background:#f7f1de; color:var(--ink);
  }
  .search-row input:focus{ outline:2px solid var(--gold); outline-offset:1px; }

  .vocab-count{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }

  .vocab-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .vocab-item{
    background:#f7f1de; border:1px solid var(--parchment-edge); border-left:3px solid var(--cedar);
    padding:16px 18px;
  }
  .vocab-item .vw{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-weight:700; font-size:16px; color:var(--cedar); margin-bottom:6px; }
  .vocab-item .vd{ font-size:14.5px; color:var(--ink); line-height:1.65; white-space:pre-wrap; }
  .vocab-item .vt{ margin-top:8px; font-size:11.5px; color:var(--ink-soft); }

  .vocab-empty, .vocab-loading{ margin:0; font-size:15px; color:var(--ink-soft); font-style:italic; }

  footer{
    max-width:720px; margin:30px auto 0; padding-inline:18px; text-align:center;
    color:var(--mh-accent); opacity:.7; font-size:12px; position:relative; z-index:1;
    transition:color 2s ease;
  }

  @media (max-width:480px){ .scroll{ padding-inline:20px; } }

  .word-tooltip{
    position:absolute; z-index:9999; max-width:280px; min-width:180px;
    background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); padding:12px 14px;
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .word-tooltip.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .word-tooltip .wt-word{ font-weight:700; font-size:14px; color:var(--ink,#2c2013); margin-bottom:6px; }
  .word-tooltip .wt-body{ font-size:13px; line-height:1.55; color:var(--ink-soft,#6b5636); white-space:pre-wrap; }
  .word-tooltip .wt-badge{ margin-top:8px; font-size:11px; color:var(--gold,#c9a24b); font-weight:600; }
  .word-tooltip .wt-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .word-tooltip .wt-head .wt-word{ margin-bottom:0; }
  .word-tooltip .wt-speak{
    background:transparent; border:1px solid var(--parchment-edge,#d8c69a); border-radius:999px;
    font-size:12px; line-height:1; padding:4px 7px; cursor:pointer; color:var(--cedar,#5b3324); flex:none;
  }
  .word-tooltip .wt-speak:hover{ background:var(--gold,#c9a24b); color:#fff; border-color:var(--gold,#c9a24b); }
  .word-tooltip .wt-speak:disabled{ opacity:.4; cursor:default; }
  .word-tooltip .wt-extra{ margin-top:8px; font-size:12px; color:var(--ink-soft,#6b5636); }
  .word-tooltip .wt-extra .wt-verses{ margin-bottom:4px; }
  .word-tooltip .wt-extra .wt-related div{ margin-bottom:2px; }
  .word-tooltip .wt-extra b{ color:var(--cedar,#5b3324); font-weight:700; }
  .word-tooltip .wt-verse-block{ margin:6px 0; }
  .word-tooltip .wt-verse-block b{ display:block; font-size:11px; color:var(--pomegranate,#8a3b3b); margin-bottom:2px; }
  .word-tooltip .wt-verse-text{ font-size:12px; line-height:1.5; color:var(--ink,#2c2013); padding-left:8px; border-left:2px solid var(--parchment-edge,#d8c69a); }
  .select-menu{
    position:absolute; z-index:10000; background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b);
    border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.3); padding:4px;
    opacity:0; transform:translateY(4px); pointer-events:none; transition:opacity .12s ease, transform .12s ease;
  }
  .select-menu.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .select-menu button{
    display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13px; color:var(--ink,#2c2013);
    padding:8px 14px; border-radius:5px; white-space:nowrap;
  }
  .select-menu button:hover{ background:var(--gold,#c9a24b); color:#fff; }

  .review-panel{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .review-panel .rp-info{ font-size:15px; color:var(--ink); }
  .review-panel .rp-info b{ color:var(--pomegranate); }
  .review-panel button{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13.5px; font-weight:600; letter-spacing:.03em;
    background:var(--cedar); color:#f7efd8; border:none; padding:10px 18px; cursor:pointer;
  }
  .review-panel button:hover{ background:#4a2a1d; }
  .review-panel button:disabled{ opacity:.45; cursor:default; }

  .vw-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .vw-speak{
    background:transparent; border:1px solid var(--parchment-edge); border-radius:999px;
    font-size:12px; padding:3px 8px; cursor:pointer; color:var(--cedar); flex:none;
  }
  .vw-speak:hover{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .vocab-item .ve{ margin-top:8px; font-size:12.5px; color:var(--ink-soft); }
  .vocab-item .ve .vev{ margin-bottom:3px; }
  .vocab-item .ve b{ color:var(--cedar); font-weight:700; }
  .vocab-item .vev-block{ margin:5px 0 5px 4px; }
  .vocab-item .vev-block b{ display:block; font-size:11px; color:var(--pomegranate); margin-bottom:2px; }
  .vocab-item .vev-text{ font-size:12px; line-height:1.5; color:var(--ink); padding-left:8px; border-left:2px solid var(--parchment-edge); }
  .vocab-item .vbox{ margin-top:6px; font-size:11px; color:var(--ink-soft); opacity:.75; }

  .flashcard-overlay{
    position:fixed; inset:0; z-index:10000; background:rgba(16,14,28,.72);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .flashcard{
    width:100%; max-width:420px; background:var(--parchment,#ecdfc2); color:var(--ink,#2c2013);
    border-radius:14px; box-shadow:0 30px 70px rgba(0,0,0,.5); padding:30px 26px 24px; position:relative;
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
  }
  .fc-close{
    position:absolute; top:12px; right:14px; background:none; border:none; font-size:18px;
    cursor:pointer; color:var(--ink-soft,#6b5636); line-height:1;
  }
  .fc-progress{ font-size:11.5px; letter-spacing:.15em; color:var(--pomegranate); font-weight:600; margin-bottom:18px; text-align:center; }
  .fc-word-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  .fc-word{ font-family:'Song Myung','Nanum Myeongjo',serif; font-size:30px; color:var(--cedar); text-align:center; }
  .fc-speak{
    background:transparent; border:1px solid var(--parchment-edge); border-radius:999px;
    font-size:15px; padding:5px 9px; cursor:pointer; color:var(--cedar); flex:none;
  }
  .fc-speak:hover{ background:var(--gold); color:#fff; }
  .fc-flip-hint{ text-align:center; font-size:12.5px; color:var(--ink-soft); font-style:italic; margin:18px 0 6px; cursor:pointer; }
  .fc-back{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--parchment-edge); }
  .fc-def{ font-size:15.5px; line-height:1.7; margin-bottom:10px; }
  .fc-extra{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .fc-extra b{ color:var(--cedar); font-weight:700; }
  .fc-actions{ display:flex; gap:10px; margin-top:20px; }
  .fc-actions button{
    flex:1; font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13.5px; font-weight:600;
    padding:11px 10px; cursor:pointer; border-radius:6px; border:1px solid var(--cedar);
  }
  .fc-actions #fcAgain{ background:transparent; color:var(--cedar); }
  .fc-actions #fcAgain:hover{ background:rgba(91,51,36,.08); }
  .fc-actions #fcGood{ background:var(--cedar); color:#f7efd8; }
  .fc-actions #fcGood:hover{ background:#4a2a1d; }
</style>

<div class="sky"></div>

<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">드래그해서 뜻 찾은 단어들</div>
    <h1 class="title">나의 단어장</h1>
    <div class="sub">본문이나 기록에서 드래그로 찾아본 단어가 여기 자동으로 쌓여요</div>
    <a class="back" href="index.html">← 솔로몬의 편지로 돌아가기</a>
  </div>

  <div class="scroll" style="margin-bottom:16px;">
    <div class="kicker">간격 반복 복습</div>
    <div class="review-panel">
      <div class="rp-info" id="reviewInfo">불러오는 중…</div>
      <button type="button" id="reviewStartBtn" hidden>오늘 복습 시작 →</button>
    </div>
  </div>

  <div class="scroll">
    <div class="kicker">단어장</div>
    <h2>모아둔 단어</h2>

    <div class="search-row">
      <input type="text" id="vocabSearch" placeholder="단어로 검색...">
    </div>
    <div class="vocab-count" id="vocabCount"></div>

    <ul class="vocab-list" id="vocabList">
      <li class="vocab-loading">불러오는 중…</li>
    </ul>
  </div>
</div>

<div class="flashcard-overlay" id="flashcardOverlay" hidden>
  <div class="flashcard">
    <button type="button" class="fc-close" id="fcClose">✕</button>
    <div class="fc-progress" id="fcProgress"></div>
    <div class="fc-word-row">
      <span class="fc-word" id="fcWord"></span>
      <button type="button" class="fc-speak" id="fcSpeak" title="발음 듣기">🔊</button>
    </div>
    <div class="fc-flip-hint" id="fcFlipHint">탭해서 뜻 보기</div>
    <div class="fc-back" id="fcBack" hidden>
      <div class="fc-def" id="fcDef"></div>
      <div class="fc-extra" id="fcExtra"></div>
      <div class="fc-actions" id="fcActions">
        <button type="button" id="fcAgain">다시 볼래요</button>
        <button type="button" id="fcGood">기억났어요</button>
      </div>
    </div>
  </div>
</div>

<footer>단어를 드래그하면 뜻이 뜨고, 자동으로 이 목록에 저장돼요 · 간격 반복으로 복습하면 오래 기억에 남아요</footer>

<script>
(function(){
  // -- 하늘 배경: 시간대에 맞춰 밤/낮/노을을 보간 (index.html과 동일 로직) --
  (function(){
    function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16), 1]; }
    function rgba(c){
      var m = c.match(/rgba?\(([^)]+)\)/);
      var p = m[1].split(',').map(function(v){ return parseFloat(v); });
      return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
    }
    function parseColor(c){ return c[0] === '#' ? hex(c) : rgba(c); }
    function lerpColor(a, b, t){
      var ca = parseColor(a), cb = parseColor(b);
      var r = ca.map(function(v, i){ return v + (cb[i] - v) * t; });
      return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + (Math.round(r[3] * 1000) / 1000) + ')';
    }
    var NIGHT = {
      bgVoid:'#100e1c', skyMid:'#17132a', bgGlow:'#2c2544', star:'#f5ecd6',
      mhAccent:'#eccd85', mhTitle:'#f7efd8', mhTitleGlow:'rgba(230,190,110,.25)',
      mhLine:'rgba(230,190,110,.3)', mhNavBg:'rgba(20,17,34,.6)', textScheme:'light'
    };
    var DAY = {
      bgVoid:'#5aa8d8', skyMid:'#a9d8ef', bgGlow:'#eef8ff', star:'#33465a',
      mhAccent:'#a9701f', mhTitle:'#233140', mhTitleGlow:'rgba(255,255,255,.5)',
      mhLine:'rgba(169,112,31,.3)', mhNavBg:'rgba(255,255,255,.6)', textScheme:'dark'
    };
    var SUNSET = {
      bgVoid:'#2e2a52', skyMid:'#9c4a72', bgGlow:'#ff9c5c', star:'#fff0dd',
      mhAccent:'#ffb473', mhTitle:'#fff4e2', mhTitleGlow:'rgba(255,140,80,.4)',
      mhLine:'rgba(255,178,120,.35)', mhNavBg:'rgba(40,22,30,.55)', textScheme:'light'
    };
    var WHITE = {
      bgVoid:'#ffffff', skyMid:'#ffffff', bgGlow:'#ffffff', star:'#2b2b2b',
      mhAccent:'#6b6b6b', mhTitle:'#1c1c1c', mhTitleGlow:'rgba(0,0,0,0)',
      mhLine:'rgba(0,0,0,.12)', mhNavBg:'rgba(0,0,0,.04)', textScheme:'dark'
    };
    var KEYS = ['bgVoid','skyMid','bgGlow','star','mhAccent','mhTitle','mhTitleGlow','mhLine','mhNavBg'];
    var TEXT_KEYS = { star:1, mhAccent:1, mhTitle:1, mhTitleGlow:1 };
    var VAR_NAME = {
      bgVoid:'--bg-void', skyMid:'--sky-mid', bgGlow:'--bg-glow', star:'--star',
      mhAccent:'--mh-accent', mhTitle:'--mh-title', mhTitleGlow:'--mh-title-glow',
      mhLine:'--mh-line', mhNavBg:'--mh-nav-bg'
    };
    function applySkyPhase(){
      var d = new Date();
      var h = d.getHours() + d.getMinutes() / 60;
      var wd = d.getDay();
      var isOfficeDay = wd >= 1 && wd <= 4;
      var dayVariant = isOfficeDay ? WHITE : DAY;
      var anchors = [[0,NIGHT],[7,NIGHT],[8,dayVariant],[18,dayVariant],[19,SUNSET],[21,NIGHT],[24,NIGHT]];
      var i = 0;
      while (i < anchors.length - 2 && h >= anchors[i + 1][0]) i++;
      var t = (h - anchors[i][0]) / (anchors[i + 1][0] - anchors[i][0]);
      var a = anchors[i][1], b = anchors[i + 1][1];
      var textT = a.textScheme !== b.textScheme ? (t < 0.5 ? 0 : 1) : t;
      var root = document.documentElement.style;
      KEYS.forEach(function(k){ root.setProperty(VAR_NAME[k], lerpColor(a[k], b[k], TEXT_KEYS[k] ? textT : t)); });
      var officeWhite = isOfficeDay && h >= 8 && h < 18;
      root.setProperty('--parchment', officeWhite ? '#ffffff' : '#ecdfc2');
      root.setProperty('--parchment-edge', officeWhite ? '#eeeeee' : '#d8c69a');
    }
    applySkyPhase();
    setInterval(applySkyPhase, 60 * 1000);
  })();

  var DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  var listEl = document.getElementById('vocabList');
  var countEl = document.getElementById('vocabCount');
  var searchEl = document.getElementById('vocabSearch');
  var reviewInfoEl = document.getElementById('reviewInfo');
  var reviewStartBtn = document.getElementById('reviewStartBtn');
  var allWords = [];
  var dbRef = null;

  var REVIEW_INTERVALS_DAYS = { 1:1, 2:3, 3:7, 4:14, 5:30 };
  function esc(s){
    return String(s || '').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
  }
  function fmtDate(ts){
    if (!ts) return '';
    var d = new Date(ts);
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
  }
  function vocabKey(word){ return 'vocab/' + encodeURIComponent(word); }
  function speak(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function renderWordExtra(w){
    var parts = [];
    if (w.verses && w.verses.length){
      var vRows = w.verses.map(function(vb){
        return '<div class="vev-block"><b>' + esc(vb.label) + '</b><div class="vev-text">' + esc(vb.text) + '</div></div>';
      }).join('');
      parts.push('<div class="vev">📖 관련 구절' + vRows + '</div>');
    }
    if (w.related && w.related.length){
      var rows = w.related.map(function(r){ return '<div>· <b>' + esc(r.word) + '</b>' + (r.nuance ? ' — ' + esc(r.nuance) : '') + '</div>'; }).join('');
      parts.push('<div><b>🔗 비슷한 단어</b>' + rows + '</div>');
    }
    return parts.length ? '<div class="ve">' + parts.join('') + '</div>' : '';
  }

  function render(filterText){
    var q = (filterText || '').trim();
    var items = q ? allWords.filter(function(w){ return w.word.indexOf(q) !== -1; }) : allWords;
    countEl.textContent = allWords.length ? ('총 ' + allWords.length + '개 저장됨' + (q ? ' · ' + items.length + '개 검색됨' : '')) : '';
    if (!items.length){
      listEl.innerHTML = '<li class="vocab-empty">' + (allWords.length ? '검색 결과가 없어요.' : '아직 저장된 단어가 없어요. 본문 위 단어를 드래그해서 뜻을 찾아보세요.') + '</li>';
      return;
    }
    listEl.innerHTML = items.map(function(w){
      var word = esc(w.word);
      var def = esc(w.definition);
      var box = w.box || 1;
      return '<li class="vocab-item">' +
        '<div class="vw-row"><div class="vw">' + word + '</div><button type="button" class="vw-speak" data-word="' + word + '" title="발음 듣기">🔊</button></div>' +
        '<div class="vd">' + def + '</div>' +
        renderWordExtra(w) +
        '<div class="vt">' + fmtDate(w.createdAt) + '</div>' +
        '<div class="vbox">복습 단계 ' + box + '/5' + (w.nextReview ? ' · 다음 복습 ' + fmtDate(w.nextReview) : '') + '</div>' +
        '</li>';
    }).join('');
    listEl.querySelectorAll('.vw-speak').forEach(function(btn){
      btn.addEventListener('click', function(){ speak(btn.getAttribute('data-word')); });
    });
  }

  function dueWords(){
    var now = Date.now();
    return allWords.filter(function(w){ return (w.nextReview || 0) <= now; });
  }

  function updateReviewPanel(){
    var due = dueWords();
    if (!allWords.length){
      reviewInfoEl.textContent = '아직 단어가 없어요. 먼저 본문에서 단어를 찾아보세요.';
      reviewStartBtn.hidden = true;
      return;
    }
    if (!due.length){
      reviewInfoEl.innerHTML = '오늘 복습할 단어가 없어요. <b>모두 완료!</b> ✨';
      reviewStartBtn.hidden = true;
      return;
    }
    reviewInfoEl.innerHTML = '오늘 복습할 단어: <b>' + due.length + '개</b>';
    reviewStartBtn.hidden = false;
  }

  // -- 플래시카드 복습 (라이트너 박스 방식 간격 반복) --
  var fcOverlay = document.getElementById('flashcardOverlay');
  var fcWordEl = document.getElementById('fcWord');
  var fcSpeakBtn = document.getElementById('fcSpeak');
  var fcFlipHint = document.getElementById('fcFlipHint');
  var fcBack = document.getElementById('fcBack');
  var fcDef = document.getElementById('fcDef');
  var fcExtra = document.getElementById('fcExtra');
  var fcProgress = document.getElementById('fcProgress');
  var fcAgainBtn = document.getElementById('fcAgain');
  var fcGoodBtn = document.getElementById('fcGood');
  var fcCloseBtn = document.getElementById('fcClose');

  var reviewQueue = [];
  var reviewIdx = 0;
  var reviewTotal = 0;

  function showCard(){
    if (reviewIdx >= reviewQueue.length){
      fcOverlay.hidden = true;
      updateReviewPanel();
      render(searchEl.value);
      return;
    }
    var w = reviewQueue[reviewIdx];
    fcProgress.textContent = (reviewIdx + 1) + ' / ' + reviewTotal;
    fcWordEl.textContent = w.word;
    fcDef.textContent = w.definition;
    fcExtra.innerHTML = renderWordExtra(w).replace(/^<div class="ve">|<\/div>$/g, '');
    fcBack.hidden = true;
    fcFlipHint.hidden = false;
  }
  function flipCard(){
    fcBack.hidden = false;
    fcFlipHint.hidden = true;
  }
  function gradeCard(good){
    var w = reviewQueue[reviewIdx];
    var box = good ? Math.min((w.box || 1) + 1, 5) : 1;
    var days = REVIEW_INTERVALS_DAYS[box] || 1;
    var nextReview = Date.now() + days * 24 * 60 * 60 * 1000;
    w.box = box; w.nextReview = nextReview;
    if (dbRef){
      dbRef.doc(vocabKey(w.word)).update({ box: box, nextReview: nextReview }).catch(function(){});
    }
    reviewIdx++;
    showCard();
  }

  reviewStartBtn.addEventListener('click', function(){
    reviewQueue = dueWords().slice().sort(function(){ return Math.random() - 0.5; });
    reviewTotal = reviewQueue.length;
    reviewIdx = 0;
    if (!reviewTotal) return;
    fcOverlay.hidden = false;
    showCard();
  });
  fcFlipHint.addEventListener('click', flipCard);
  fcWordEl.addEventListener('click', flipCard);
  fcSpeakBtn.addEventListener('click', function(){ speak(fcWordEl.textContent); });
  fcAgainBtn.addEventListener('click', function(){ gradeCard(false); });
  fcGoodBtn.addEventListener('click', function(){ gradeCard(true); });
  fcCloseBtn.addEventListener('click', function(){
    fcOverlay.hidden = true;
    updateReviewPanel();
    render(searchEl.value);
  });

  DB_PROMISE.then(function(db){
    if (!db){
      listEl.innerHTML = '<li class="vocab-empty">이 기능은 Claude 아티팩트 화면에서만 동작해요.</li>';
      reviewInfoEl.textContent = '이 기능은 Claude 아티팩트 화면에서만 동작해요.';
      return;
    }
    dbRef = db;
    return db.collection('vocab').get().then(function(qs){
      allWords = (qs && qs.docs ? qs.docs : []).map(function(s){ return s.data(); }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      render('');
      updateReviewPanel();
    });
  }).catch(function(){
    listEl.innerHTML = '<li class="vocab-empty">단어장을 불러오지 못했어요.</li>';
    reviewInfoEl.textContent = '불러오지 못했어요.';
  });

  searchEl.addEventListener('input', function(){ render(searchEl.value); });
})();
</script>

<script>
(function(){
  if (window.__wordTooltipInit) return;
  window.__wordTooltipInit = true;

  var BOOK_INDEX = {"창세기":1, "출애굽기":2, "레위기":3, "민수기":4, "신명기":5, "여호수아":6, "사사기":7, "룻기":8, "사무엘상":9, "사무엘하":10, "열왕기상":11, "열왕기하":12, "역대상":13, "역대하":14, "에스라":15, "느헤미야":16, "에스더":17, "욥기":18, "시편":19, "잠언":20, "전도서":21, "아가":22, "이사야":23, "예레미야":24, "예레미야애가":25, "에스겔":26, "다니엘":27, "호세아":28, "요엘":29, "아모스":30, "오바댜":31, "요나":32, "미가":33, "나훔":34, "하박국":35, "스바냐":36, "학개":37, "스가랴":38, "말라기":39, "마태복음":40, "마가복음":41, "누가복음":42, "요한복음":43, "사도행전":44, "로마서":45, "고린도전서":46, "고린도후서":47, "갈라디아서":48, "에베소서":49, "빌립보서":50, "골로새서":51, "데살로니가전서":52, "데살로니가후서":53, "디모데전서":54, "디모데후서":55, "디도서":56, "빌레몬서":57, "히브리서":58, "야고보서":59, "베드로전서":60, "베드로후서":61, "요한일서":62, "요한이서":63, "요한삼서":64, "유다서":65, "요한계시록":66};

  var SAMPLE_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('sample')
    : Promise.resolve(null);
  var VOCAB_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  function speakKorean(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function escHtml(s){
    return String(s || '').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
  }
  function pad(n, w){ n = String(n); while (n.length < w) n = '0' + n; return n; }
  function chapterDocId(book, chapter){
    var num = BOOK_INDEX[book];
    if (!num) return null;
    return pad(num, 2) + '-' + pad(chapter, 3);
  }
  function resolveVerses(db, refs){
    if (!db || !refs || !refs.length) return Promise.resolve([]);
    return Promise.all(refs.map(function(ref){
      var docId = chapterDocId(ref.book, ref.chapter);
      if (!docId) return null;
      return db.doc('bible/' + docId).get().then(function(snap){
        if (!snap.exists) return null;
        var data = snap.data();
        var start = ref.start || 1;
        var end = ref.end || start;
        var matched = (data.verses || []).filter(function(v){
          var n = parseInt(v.n, 10);
          return n >= start && n <= end;
        });
        if (!matched.length) return null;
        var label = ref.book + ' ' + ref.chapter + ':' + start + (end !== start ? '-' + end : '');
        var text = matched.map(function(v){ return v.n + '. ' + v.t; }).join(' ');
        return { label: label, text: text };
      }).catch(function(){ return null; });
    })).then(function(results){ return results.filter(Boolean); });
  }

  var tooltipEl = null;
  function ensureTooltip(){
    if (tooltipEl) return tooltipEl;
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    tooltipEl.innerHTML = '<div class="wt-head"><span class="wt-word"></span><button type="button" class="wt-speak" title="발음 듣기">\ud83d\udd0a</button></div><div class="wt-body"></div><div class="wt-extra"></div><div class="wt-badge" hidden></div>';
    document.body.appendChild(tooltipEl);
    tooltipEl.querySelector('.wt-speak').addEventListener('click', function(){
      speakKorean(tooltipEl.querySelector('.wt-word').textContent);
    });
    return tooltipEl;
  }
  function hideTooltip(){ if (tooltipEl) tooltipEl.classList.remove('open'); }
  function positionTooltip(rect){
    var el = ensureTooltip();
    var top = window.scrollY + rect.bottom + 8;
    var left = window.scrollX + rect.left;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 16;
    if (left > maxLeft) left = Math.max(12, maxLeft);
    if (left < 12) left = 12;
    el.style.top = top + 'px';
    el.style.left = left + 'px';
  }
  function vocabKey(word){ return 'vocab/' + encodeURIComponent(word); }
  function renderExtra(el, entry){
    var parts = [];
    if (entry.verses && entry.verses.length){
      var vRows = entry.verses.map(function(vb){
        return '<div class="wt-verse-block"><b>' + escHtml(vb.label) + '</b><div class="wt-verse-text">' + escHtml(vb.text) + '</div></div>';
      }).join('');
      parts.push('<div class="wt-verses">\ud83d\udcd6 관련 구절' + vRows + '</div>');
    }
    if (entry.related && entry.related.length){
      var rows = entry.related.map(function(r2){
        return '<div>· <b>' + escHtml(r2.word) + '</b>' + (r2.nuance ? ' — ' + escHtml(r2.nuance) : '') + '</div>';
      }).join('');
      parts.push('<div class="wt-related"><b>\ud83d\udd17 비슷한 단어</b>' + rows + '</div>');
    }
    el.innerHTML = parts.join('');
  }
  function lookupWord(word){
    return VOCAB_DB_PROMISE.then(function(db){
      if (!db) return { db: null, hit: null };
      return db.doc(vocabKey(word)).get().then(function(snap){
        return { db: db, hit: (snap && snap.exists) ? snap.data() : null };
      }).catch(function(){ return { db: db, hit: null }; });
    }).then(function(r){
      if (r.hit) return Object.assign({ cached: true }, r.hit);
      return SAMPLE_PROMISE.then(function(sample){
        if (!sample) return null;
        return sample.json(
          '아래 한국어 단어 또는 구절을 성경 본문에서 만났다. 다음 JSON 형식으로만 답해라(다른 설명 없이):\n' +
          '{"definition": "2~3문장의 기본 뜻, 신앙·성경 맥락 고려, 인사말 없이", "verses": [{"book": "사도행전", "chapter": 16, "start": 31, "end": 34}], "related": [{"word": "비슷한 뜻이지만 뉘앙스가 다른 단어", "nuance": "그 차이를 1문장으로"}]}\n' +
          'verses의 book은 정확한 개역한글 성경 책 이름 하나(창세기~요한계시록 중), chapter/start/end는 숫자. 이 단어와 실제로 관련 있는 구절 1~2개만 골라라. 원어(히브리어/헬라어)나 번역에 따라 뜻이 갈리는 지점이 있으면 definition이나 nuance에 녹여라. related는 뜻은 비슷하지만 결이 다른 단어 0~3개, 없으면 빈 배열.\n\n단어: ' + word,
          { modelTier: 'quick' }
        ).then(function(data){
          var definition = String((data && data.definition) || '').trim();
          var refs = Array.isArray(data && data.verses) ? data.verses.filter(function(v){
            return v && v.book && BOOK_INDEX[v.book] && v.chapter;
          }).map(function(v){
            return { book: String(v.book), chapter: Number(v.chapter), start: Number(v.start || 1), end: Number(v.end || v.start || 1) };
          }) : [];
          var related = Array.isArray(data && data.related)
            ? data.related.filter(function(r2){ return r2 && r2.word; }).map(function(r2){ return { word: String(r2.word), nuance: String(r2.nuance || '') }; })
            : [];
          return resolveVerses(r.db, refs).then(function(verseBlocks){
            var entry = { word: word, definition: definition, verses: verseBlocks, related: related, createdAt: Date.now(), box: 1, nextReview: Date.now() };
            if (r.db){ r.db.doc(vocabKey(word)).set(entry).catch(function(){}); }
            return Object.assign({ cached: false }, entry);
          });
        });
      });
    });
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  var pending = 0;
  function handleSelection(){
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text || text.length < 1 || text.length > 30 || text.indexOf('\n') !== -1){ hideTooltip(); return; }
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (isInsideFormField(range.commonAncestorContainer)){ hideTooltip(); return; }
    var rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    var el = ensureTooltip();
    el.querySelector('.wt-word').textContent = text;
    el.querySelector('.wt-body').textContent = '뜻을 찾는 중...';
    el.querySelector('.wt-extra').innerHTML = '';
    var badge = el.querySelector('.wt-badge');
    badge.hidden = true;
    el.classList.add('open');
    positionTooltip(rect);

    var myTicket = ++pending;
    lookupWord(text).then(function(result){
      if (myTicket !== pending) return;
      if (!result){
        el.querySelector('.wt-body').textContent = '이 기능은 Claude 아티팩트 화면에서만 동작해요.';
        return;
      }
      el.querySelector('.wt-body').textContent = result.definition;
      renderExtra(el.querySelector('.wt-extra'), result);
      badge.hidden = false;
      badge.className = 'wt-badge' + (result.cached ? ' cached' : '');
      badge.textContent = result.cached ? '⚡ 단어장에서 바로 불러왔어요 (무료)' : '✓ 단어장에 저장했어요';
    }).catch(function(){
      if (myTicket !== pending) return;
      el.querySelector('.wt-body').textContent = '뜻을 가져오지 못했어요.';
    });
  }
  document.addEventListener('mouseup', function(e){
    if (e.button !== 0) return;
    if (e.target && e.target.closest && (e.target.closest('.word-tooltip') || e.target.closest('.select-menu'))) return;
    setTimeout(handleSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!(e.target && e.target.closest && e.target.closest('.word-tooltip'))) hideTooltip();
  });
  document.addEventListener('scroll', hideTooltip, true);
})();
</script>


<script>
(function(){
  if (window.__quoteSaveInit) return;
  window.__quoteSaveInit = true;

  var QUOTES_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  var menuEl = null;
  function ensureMenu(){
    if (menuEl) return menuEl;
    menuEl = document.createElement('div');
    menuEl.className = 'select-menu';
    menuEl.innerHTML = '<button type="button" class="sm-save">\ud83d\udccc 이 구절 저장하기</button>';
    document.body.appendChild(menuEl);
    return menuEl;
  }
  function hideMenu(){ if (menuEl) menuEl.classList.remove('open'); }
  function captureBibleRef(sel){
    try {
      if (!sel || !sel.rangeCount) return null;
      var range = sel.getRangeAt(0);
      var anchor = sel.anchorNode;
      var anchorEl = anchor && anchor.nodeType === 1 ? anchor : (anchor ? anchor.parentElement : null);
      var dayEl = anchorEl && anchorEl.closest ? anchorEl.closest('.reading-day') : null;
      if (!dayEl) return null;
      var bookKr = dayEl.getAttribute('data-book-kr');
      var bookEn = dayEl.getAttribute('data-book-en');
      var chapter = dayEl.getAttribute('data-chapter');
      if (!bookKr || !chapter) return null;
      var verses = [];
      dayEl.querySelectorAll('.rv[data-verse]').forEach(function(rv){
        if (!range.intersectsNode(rv)) return;
        var koEl = rv.querySelector('.ko');
        var enEl = rv.querySelector('.en');
        verses.push({
          n: parseInt(rv.getAttribute('data-verse'), 10) || 0,
          ko: koEl ? koEl.textContent.replace(/^\s*\d+\s*/, '').trim() : '',
          en: enEl ? enEl.textContent.trim() : ''
        });
      });
      if (!verses.length) return null;
      verses.sort(function(a,b){ return a.n - b.n; });
      var vMin = verses[0].n, vMax = verses[verses.length - 1].n;
      return {
        bookKr: bookKr,
        bookEn: bookEn,
        chapter: parseInt(chapter, 10),
        verseStart: vMin,
        verseEnd: vMax,
        label: bookKr + ' ' + chapter + '\uc7a5 ' + vMin + (vMax > vMin ? '-' + vMax : '') + '\uc808',
        labelEn: (bookEn || '') + ' ' + chapter + ':' + vMin + (vMax > vMin ? '-' + vMax : ''),
        koText: verses.map(function(v){ return v.n + '. ' + v.ko; }).join('\n'),
        enText: verses.map(function(v){ return v.n + '. ' + v.en; }).join('\n')
      };
    } catch (err) { return null; }
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  function positionMenu(menu, x, y){
    var maxLeft = window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8;
    var left = Math.min(x, Math.max(8, maxLeft));
    menu.style.left = left + 'px';
    menu.style.top = y + 'px';
  }
  function saveQuote(text, btn, bibleRef){
    QUOTES_DB_PROMISE.then(function(db){
      if (!db) return;
      var id = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      var entry = {
        text: text,
        source: (document.title || '').replace(/\s+/g, ' ').trim(),
        createdAt: Date.now()
      };
      if (bibleRef) entry.bibleRef = bibleRef;
      db.doc('quotes/' + id).set(entry).then(function(){
        document.dispatchEvent(new CustomEvent('solomon-quote-saved', { detail: entry }));
      }).catch(function(){});
    });
    if (btn) btn.textContent = '\u2713 저장했어요';
    setTimeout(hideMenu, 700);
  }
  document.addEventListener('contextmenu', function(e){
    if (isInsideFormField(e.target)) return;
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text) { hideMenu(); return; }
    e.preventDefault();
    var bibleRef = captureBibleRef(sel);
    var menu = ensureMenu();
    var btn = menu.querySelector('.sm-save');
    btn.textContent = '\ud83d\udccc 이 구절 저장하기';
    menu.classList.add('open');
    positionMenu(menu, window.scrollX + e.clientX, window.scrollY + e.clientY);
    btn.onclick = function(){ saveQuote(text, btn, bibleRef); };
  });
  document.addEventListener('click', function(e){
    if (menuEl && !(e.target.closest && e.target.closest('.select-menu'))) hideMenu();
  });
  document.addEventListener('scroll', hideMenu, true);
})();
</script>

<script>
(function(){
  if (window.__scrollTopInit) return;
  window.__scrollTopInit = true;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'scroll-top-btn';
  btn.setAttribute('aria-label', '\ub9e8 \uc704\ub85c');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  document.body.appendChild(btn);
  function update(){
    if (window.scrollY > 320) btn.classList.add('show'); else btn.classList.remove('show');
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
  btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
