<title>오늘의 조각</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Square:wght@400;700;800&display=swap');

  :root{
    --bg-void:#100e1c;
    --bg-glow:#2c2544;
    --sky-mid:#17132a;
    --gold:#c9a24b;
    --gold-bright:#eccd85;
    --parchment:#ecdfc2;
    --parchment-edge:#d8c69a;
    --ink:#2c2013;
    --ink-soft:#6b5636;
    --cedar:#5b3324;
    --pomegranate:#8a3b3b;
    --star:#f5ecd6;
    --card:#f7f1de;
    --mh-accent:#eccd85;
    --mh-title:#f7efd8;
    --mh-title-glow:rgba(230,190,110,.25);
    --mh-line:rgba(230,190,110,.3);
    --mh-nav-bg:rgba(20,17,34,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0; background:var(--bg-void); color:var(--ink);
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .sky{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--sky-mid) 55%, var(--bg-glow) 100%);
    transition:background 2s ease;
    pointer-events:none;
  }
  .wrap{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:44px 18px 70px; }

  .masthead{ text-align:center; color:var(--star); margin-bottom:28px; transition:color 2s ease; }
  .eyebrow{ font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--mh-accent); opacity:.9; margin-bottom:8px; transition:color 2s ease; }
  h1.title{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(28px,6.5vw,40px); margin:0 0 8px; color:var(--mh-title);
    text-shadow:0 0 24px var(--mh-title-glow);
    transition:color 2s ease, text-shadow 2s ease;
  }
  .sub{ font-size:14px; color:var(--mh-accent); opacity:.85; transition:color 2s ease; }
  a.back{
    display:inline-block; margin-top:14px; font-size:12.5px; color:var(--mh-accent);
    text-decoration:none; border-bottom:1px solid var(--mh-line);
    transition:color 2s ease, border-color 2s ease;
  }

  nav.days{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:22px;
    -webkit-overflow-scrolling:touch;
  }
  nav.days::-webkit-scrollbar{ display:none; }
  nav.days button{
    flex:none; font-family:inherit; font-size:13px; font-weight:600; letter-spacing:.02em;
    padding:9px 16px; border-radius:999px; border:1px solid var(--mh-line);
    background:var(--mh-nav-bg); color:var(--mh-accent); cursor:pointer;
    transition:color 2s ease, background 2s ease, border-color 2s ease;
  }
  nav.days button.active{ background:var(--gold); border-color:var(--gold); color:#20160a; }
  nav.days button.today::after{ content:'•'; margin-left:4px; }

  .panel{
    background:var(--parchment); border:1px solid var(--parchment-edge);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    padding:24px 20px 20px;
    transition:background-color 1.5s ease, border-color 1.5s ease;
  }
  .panel h2{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400; font-size:22px;
    margin:0 0 4px; color:var(--cedar);
  }
  .panel .date-line{ font-family:'IBM Plex Sans KR','Noto Sans KR',sans-serif; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }

  ul.items{ list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:8px; }
  li.item{
    display:flex; align-items:flex-start; gap:10px;
    background:#fffdf7; border:1px solid var(--parchment-edge);
    border-left:4px solid var(--cat-color, var(--gold));
    padding:10px 12px; border-radius:2px;
  }
  li.item.checked{ opacity:.5; }
  li.item.checked .text{ text-decoration:line-through; }
  li.item input[type=checkbox]{
    margin-top:2px; width:17px; height:17px; accent-color:var(--cat-color, var(--cedar)); flex:none; cursor:pointer;
  }
  li.item .text{ flex:1; font-size:14.5px; color:var(--ink); word-break:break-word; }
  li.item .cat-label{
    font-size:10.5px; font-weight:600; letter-spacing:.03em; color:var(--cat-color, var(--ink-soft));
    display:block; margin-bottom:2px;
  }
  li.item button.del{
    flex:none; border:none; background:none; color:var(--ink-soft); opacity:.5;
    font-size:18px; line-height:1; cursor:pointer;
    /* 삭제가 안 눌린다는 보고가 있어 터치 영역을 넉넉히 키움 (기존엔 2px 4px로 너무 작았다) */
    min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center;
    margin:-10px -10px -10px 0; touch-action:manipulation;
  }
  li.item button.del:hover{ opacity:1; color:var(--pomegranate); }
  ul.items .empty{ font-size:13.5px; color:var(--ink-soft); font-style:italic; padding:6px 2px; }

  .timeline{ display:flex; margin:0 0 14px; }
  .timeline-hours{ flex:none; width:38px; position:relative; }
  .timeline-hours .hr{
    position:absolute; left:0; right:6px; text-align:right;
    font-size:10px; color:var(--ink-soft); opacity:.75; transform:translateY(-50%);
  }
  .timeline-track{
    position:relative; flex:1; min-width:0;
    border-left:1px solid var(--parchment-edge);
    cursor:copy;
  }
  .timeline-track .gridline{ position:absolute; left:0; right:0; border-top:1px dashed var(--parchment-edge); opacity:.6; }
  .timeline-block{
    position:absolute; box-sizing:border-box; overflow:hidden;
    background:#fffdf7; border:1px solid var(--parchment-edge);
    border-left:4px solid var(--cat-color, var(--gold));
    border-radius:2px; padding:7px 22px 7px 9px; cursor:pointer;
  }
  .timeline-block.checked{ opacity:.5; }
  .timeline-block.checked .text{ text-decoration:line-through; }
  .timeline-block.gcal{ cursor:default; }
  .row1{ display:flex; align-items:flex-start; gap:6px; flex:1; min-width:0; }
  .timeline-block input[type=checkbox]{
    margin-top:2px; width:14px; height:14px; accent-color:var(--cat-color, var(--cedar)); flex:none; cursor:pointer;
  }
  .timeline-block .cat-label{ font-size:9.5px; font-weight:600; letter-spacing:.02em; color:var(--cat-color, var(--ink-soft)); display:block; margin-bottom:4px; }
  .timeline-block .text{ font-size:12.5px; line-height:1.4; color:var(--ink); word-break:break-word; }
  .timeline-block .del{
    position:absolute; top:-2px; right:-2px; border:none; background:none; color:var(--ink-soft);
    opacity:.5; font-size:14px; line-height:1; cursor:pointer;
    min-width:34px; min-height:34px; display:flex; align-items:center; justify-content:center;
    touch-action:manipulation;
  }
  .timeline-block .del:hover{ opacity:1; color:var(--pomegranate); }
  .block-edit{ display:flex; flex-direction:column; gap:8px; padding:2px; }
  .block-edit input[type=text], .block-edit select{
    font:inherit; font-size:13px; padding:7px 8px; border-radius:3px;
    border:1px solid var(--parchment-edge); background:#fffdf7; color:var(--ink);
  }
  .block-edit input[type=text]:focus, .block-edit select:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .block-edit .time-row{
    display:flex; gap:4px; align-items:center; background:#fffdf7;
    border:1px solid var(--parchment-edge); border-radius:3px; padding:0 6px; width:fit-content;
  }
  .block-edit .time-row .tilde{ color:var(--ink-soft); font-size:11px; }
  .block-edit .time-row .time-pick-label{ font-size:11.5px; padding:6px 4px; }
  .repeat-row{ display:flex; flex-direction:column; gap:5px; }
  .repeat-label{ font-size:10px; letter-spacing:.1em; color:var(--ink-soft); font-weight:600; }
  .repeat-days{ display:flex; gap:4px; }
  .day-toggle{
    font:inherit; font-size:11.5px; width:24px; height:24px; line-height:1;
    border:1px solid var(--parchment-edge); background:#fffdf7; color:var(--ink-soft);
    border-radius:50%; cursor:pointer; padding:0;
  }
  .day-toggle.on{ background:var(--cedar); color:#f7efd8; border-color:var(--cedar); font-weight:700; }
  .block-edit .edit-btns{ display:flex; gap:8px; align-items:center; }
  .block-edit .edit-btns button{
    font:inherit; font-size:11.5px; font-weight:600; border:none; padding:6px 12px; cursor:pointer; border-radius:3px;
  }
  .block-edit .save{ background:var(--cedar); color:#f7efd8; }
  .block-edit .save:hover{ background:#4a2a1d; }
  .block-edit .cancel{ background:none; color:var(--ink-soft); padding:6px 4px; }
  .block-edit .cancel:hover{ color:var(--pomegranate); }
  .unsched-label{ font-size:11px; letter-spacing:.15em; color:var(--ink-soft); margin:0 0 8px; }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin:0 0 18px; }
  .legend .dot-row{ display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-soft); }
  .legend .dot{ width:9px; height:9px; border-radius:50%; background:var(--dot-color,#999); flex:none; }

  .add-form{
    margin-top:16px;
    background:rgba(91,51,36,.045); border:1px solid var(--parchment-edge);
    padding:16px; border-radius:3px;
  }
  .add-form-label{
    font-size:11px; letter-spacing:.14em; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; margin-bottom:10px;
  }
  .add-form input[type=text], .add-form select{
    font-family:inherit; font-size:13.5px; color:var(--ink);
    background:#fffdf7; border:1px solid var(--parchment-edge); border-radius:3px;
  }
  .add-form input[type=text]:focus, .add-form select:focus{
    outline:2px solid var(--gold); outline-offset:1px;
  }
  .add-form .add-text{ width:100%; padding:10px 12px; margin-bottom:10px; box-sizing:border-box; }
  .add-form-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .add-form-row:last-child{ margin-bottom:0; }
  .add-form select{ flex:1 1 140px; min-width:0; padding:9px 10px; }
  .time-field{
    display:flex; align-items:center; gap:4px;
    background:#fffdf7; border:1px solid var(--parchment-edge); border-radius:3px; padding:0 6px;
  }
  .time-field .tilde{ color:var(--ink-soft); font-size:12px; }

  /* -- 커스텀 시간 선택기 (5분 단위, 회색 톤) -- */
  .time-pick{ position:relative; cursor:pointer; user-select:none; }
  .time-pick-label{
    display:block; padding:8px 6px; font-size:12.5px; color:var(--ink); white-space:nowrap;
    border-radius:3px;
  }
  .time-pick.open .time-pick-label{ background:#e4e1da; }
  .time-pick-menu{
    position:absolute; top:calc(100% + 4px); left:0; z-index:30;
    background:#fffdf7; border:1px solid var(--parchment-edge); border-radius:4px;
    box-shadow:0 8px 22px rgba(0,0,0,.2); max-height:190px; overflow-y:auto; min-width:104px;
  }
  .time-pick-opt{ padding:7px 14px; font-size:12.5px; color:var(--ink); white-space:nowrap; }
  .time-pick-opt:hover{ background:#ececea; }
  .time-pick-opt.sel{ background:#d9d6cf; font-weight:700; }
  .add-form button{
    font-family:inherit; font-size:13.5px; font-weight:600; letter-spacing:.02em;
    background:var(--cedar); color:#f7efd8; border:none; padding:10px 20px; cursor:pointer;
    border-radius:3px; flex:none; margin-left:auto;
  }
  .add-form button:hover{ background:#4a2a1d; }

  .progress{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }

  footer{
    max-width:640px; margin:30px auto 0; padding-inline:18px; text-align:center;
    color:var(--mh-accent); opacity:.7; font-size:12px; position:relative; z-index:1;
    transition:color 2s ease;
  }

  @media (max-width:480px){ .panel{ padding:20px 16px 16px; } }

  .word-tooltip{
    position:absolute; z-index:9999; max-width:280px; min-width:180px;
    background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); padding:12px 14px;
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .word-tooltip.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .word-tooltip .wt-word{ font-weight:700; font-size:14px; color:var(--ink,#2c2013); margin-bottom:6px; }
  .word-tooltip .wt-body{ font-size:13px; line-height:1.55; color:var(--ink-soft,#6b5636); white-space:pre-wrap; }
  .word-tooltip .wt-badge{ margin-top:8px; font-size:11px; color:var(--gold,#c9a24b); font-weight:600; }
  .word-tooltip .wt-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .word-tooltip .wt-head .wt-word{ margin-bottom:0; }
  .word-tooltip .wt-speak{
    background:transparent; border:1px solid var(--parchment-edge,#d8c69a); border-radius:999px;
    font-size:12px; line-height:1; padding:4px 7px; cursor:pointer; color:var(--cedar,#5b3324); flex:none;
  }
  .word-tooltip .wt-speak:hover{ background:var(--gold,#c9a24b); color:#fff; border-color:var(--gold,#c9a24b); }
  .word-tooltip .wt-speak:disabled{ opacity:.4; cursor:default; }
  .word-tooltip .wt-extra{ margin-top:8px; font-size:12px; color:var(--ink-soft,#6b5636); }
  .word-tooltip .wt-extra .wt-verses{ margin-bottom:4px; }
  .word-tooltip .wt-extra .wt-related div{ margin-bottom:2px; }
  .word-tooltip .wt-extra b{ color:var(--cedar,#5b3324); font-weight:700; }
  .word-tooltip .wt-verse-block{ margin:6px 0; }
  .word-tooltip .wt-verse-block b{ display:block; font-size:11px; color:var(--pomegranate,#8a3b3b); margin-bottom:2px; }
  .word-tooltip .wt-verse-text{ font-size:12px; line-height:1.5; color:var(--ink,#2c2013); padding-left:8px; border-left:2px solid var(--parchment-edge,#d8c69a); }
  .select-menu{
    position:absolute; z-index:10000; background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b);
    border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.3); padding:4px;
    opacity:0; transform:translateY(4px); pointer-events:none; transition:opacity .12s ease, transform .12s ease;
  }
  .select-menu.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .select-menu button{
    display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13px; color:var(--ink,#2c2013);
    padding:8px 14px; border-radius:5px; white-space:nowrap;
  }
  .select-menu button:hover{ background:var(--gold,#c9a24b); color:#fff; }
</style>

<script>
(function(){
  // -- 하늘 배경: 시간대에 맞춰 밤/낮/노을을 보간 (index.html과 동일 로직) --
  (function(){
    function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16), 1]; }
    function rgba(c){
      var m = c.match(/rgba?\(([^)]+)\)/);
      var p = m[1].split(',').map(function(v){ return parseFloat(v); });
      return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
    }
    function parseColor(c){ return c[0] === '#' ? hex(c) : rgba(c); }
    function lerpColor(a, b, t){
      var ca = parseColor(a), cb = parseColor(b);
      var r = ca.map(function(v, i){ return v + (cb[i] - v) * t; });
      return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + (Math.round(r[3] * 1000) / 1000) + ')';
    }
    var NIGHT = {
      bgVoid:'#100e1c', skyMid:'#17132a', bgGlow:'#2c2544', star:'#f5ecd6',
      mhAccent:'#eccd85', mhTitle:'#f7efd8', mhTitleGlow:'rgba(230,190,110,.25)',
      mhLine:'rgba(230,190,110,.3)', mhNavBg:'rgba(20,17,34,.6)', textScheme:'light'
    };
    var DAY = {
      bgVoid:'#5aa8d8', skyMid:'#a9d8ef', bgGlow:'#eef8ff', star:'#33465a',
      mhAccent:'#a9701f', mhTitle:'#233140', mhTitleGlow:'rgba(255,255,255,.5)',
      mhLine:'rgba(169,112,31,.3)', mhNavBg:'rgba(255,255,255,.6)', textScheme:'dark'
    };
    var SUNSET = {
      bgVoid:'#2e2a52', skyMid:'#9c4a72', bgGlow:'#ff9c5c', star:'#fff0dd',
      mhAccent:'#ffb473', mhTitle:'#fff4e2', mhTitleGlow:'rgba(255,140,80,.4)',
      mhLine:'rgba(255,178,120,.35)', mhNavBg:'rgba(40,22,30,.55)', textScheme:'light'
    };
    // 월~목 08~18시 "위장 모드" — 회사에서 볼 때 티나지 않도록 낮 하늘을 새하얗게
    var WHITE = {
      bgVoid:'#ffffff', skyMid:'#ffffff', bgGlow:'#ffffff', star:'#2b2b2b',
      mhAccent:'#6b6b6b', mhTitle:'#1c1c1c', mhTitleGlow:'rgba(0,0,0,0)',
      mhLine:'rgba(0,0,0,.12)', mhNavBg:'rgba(0,0,0,.04)', textScheme:'dark'
    };
    var KEYS = ['bgVoid','skyMid','bgGlow','star','mhAccent','mhTitle','mhTitleGlow','mhLine','mhNavBg'];
    var TEXT_KEYS = { star:1, mhAccent:1, mhTitle:1, mhTitleGlow:1 };
    var VAR_NAME = {
      bgVoid:'--bg-void', skyMid:'--sky-mid', bgGlow:'--bg-glow', star:'--star',
      mhAccent:'--mh-accent', mhTitle:'--mh-title', mhTitleGlow:'--mh-title-glow',
      mhLine:'--mh-line', mhNavBg:'--mh-nav-bg'
    };
    function applySkyPhase(){
      var d = new Date();
      var h = d.getHours() + d.getMinutes() / 60;
      var wd = d.getDay();

    } else if (codes.some(function(c){ return c === 'ok'; })) {
      var failed = Object.keys(CATEGORY_CALENDAR).filter(function(cat){ return calendarStatus[cat] && calendarStatus[cat] !== 'ok'; });
      text = '⚠️ 일부만 연동됨 · 실패: ' + failed.map(function(c){ return (CATEGORIES[c]||{label:c}).label + '(' + calendarStatus[c] + ')'; }).join(', ');
    } else if (codes.some(function(c){ return c && c !== 'pending'; })) {
      text = '⚠️ 캘린더 연동 안 됨 · ' + (calendarStatus[Object.keys(CATEGORY_CALENDAR)[0]] || '');
    } else {
      text = '📅 캘린더 연동 확인 중…';
    }
    calendarStatusEl.textContent = text;
  }
  function initCalendarSync(){
    CHECKLIST_MCP_PROMISE.then(function(mcp){
      if (!mcp) { calendarStatus.__unavailable = true; renderCalendarStatus(); return; }
      var range = todayRange();
      Object.keys(CATEGORY_CALENDAR).forEach(function(cat){
        var calendarId = CATEGORY_CALENDAR[cat];
        calendarStatus[cat] = 'pending';
        try {
          mcp.watchTool('Google Calendar', 'list_events',
            { calendarId: calendarId, startTime: range.startTime, endTime: range.endTime, orderBy: 'startTime' },
            function(ev){
              if (ev.type === 'data') {
                calendarStatus[cat] = 'ok';
                var payload = ev.result && ev.result.payload;
                var rawItems = (payload && (payload.items || payload.events)) || [];
                calendarEvents[cat] = rawItems.map(function(e, idx){
                  var title = e.summary || e.title || '(제목 없음)';
                  var startIso = e.start && (e.start.dateTime || e.start.date);
                  var endIso = e.end && (e.end.dateTime || e.end.date);
                  var hasTime = !!(e.start && e.start.dateTime);
                  var startHM = hasTime ? isoToHM(startIso) : null;
                  var endHM = (hasTime && endIso) ? isoToHM(endIso) : null;
                  return { id: 'gcal_' + cat + '_' + (e.id || idx), it: { cat: cat, text: '📅 ' + title, start: startHM, end: endHM } };
                });
              } else {
                calendarStatus[cat] = 'error:' + (ev.error && ev.error.code || 'unknown');
                if (ev.error && (ev.error.code === 'needs_reauth' || ev.error.code === 'server_not_connected' || ev.error.code === 'not_in_manifest' || ev.error.code === 'consent_required')) {
                  calendarEvents[cat] = [];
                }
                // 그 외 일시적 오류(server_unavailable 등)는 마지막으로 받은 값을 그대로 둔다
              }
              renderCalendarStatus();
              render();
            },
            { refetchInterval: 5 * 60 * 1000 }
          );
        } catch (e) {
          calendarStatus[cat] = 'error:exception';
        }
      });
      renderCalendarStatus();
    }).catch(function(){ calendarStatus.__unavailable = true; renderCalendarStatus(); });
  }

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  var today = new Date();
  var todayDayKey = DAY_KEYS[today.getDay()];
  var selectedDay = todayDayKey;
  var editingId = null; // 지금 인라인 편집 중인 항목의 id (있으면)
  var draftEntry = null; // 타임라인 빈 자리를 클릭해서 만든, 아직 저장 안 된 새 항목 초안

  var TIMELINE_START_MIN = 6 * 60;
  var TIMELINE_END_MIN = 24 * 60;
  var PX_PER_HOUR = 76;
  function minutesFromHM(hm){
    var parts = (hm || '').split(':');
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }
  function addOneHour(hm){
    var total = (minutesFromHM(hm) + 60) % (24 * 60);
    var h = Math.floor(total / 60), m = total % 60;
    return (h < 10 ? '0'+h : ''+h) + ':' + (m < 10 ? '0'+m : ''+m);
  }
  function layoutTimedEntries(entries){
    var items = entries.map(function(e){
      var s = minutesFromHM(e.it.start), en = minutesFromHM(e.it.end);
      if (s == null) return null;
      if (en == null || en <= s) en = s + 30;
      return { entry: e, s: s, en: en };
    }).filter(Boolean).sort(function(a, b){ return a.s - b.s || a.en - b.en; });

    var clusters = [], current = [], currentEnd = -Infinity;
    items.forEach(function(it){
      if (current.length && it.s >= currentEnd) { clusters.push(current); current = []; currentEnd = -Infinity; }
      current.push(it);
      currentEnd = Math.max(currentEnd, it.en);
    });
    if (current.length) clusters.push(current);

    var laidOut = [];
    clusters.forEach(function(cluster){
      var columns = [];
      cluster.forEach(function(it){
        var colIdx = -1;
        for (var i = 0; i < columns.length; i++){ if (columns[i] <= it.s) { colIdx = i; break; } }
        if (colIdx === -1) { colIdx = columns.length; columns.push(it.en); } else columns[colIdx] = it.en;
        it.col = colIdx;
      });
      var colCount = columns.length;
      cluster.forEach(function(it){ laidOut.push({ entry: it.entry, s: it.s, en: it.en, col: it.col, cols: colCount }); });
    });
    return laidOut;
  }

  // -- nav --
  var navEl = document.getElementById('dayNav');
  var ORDER = ['mon','tue','wed','thu','fri','sat','sun'];
  ORDER.forEach(function(k){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = DAY_LABELS[k] + '요일';
    btn.className = k === todayDayKey ? 'today' : '';
    btn.addEventListener('click', function(){ selectedDay = k; render(); });
    btn.setAttribute('data-day', k);
    navEl.appendChild(btn);
  });

  // -- category select for add-row --
  var newCatEl = document.getElementById('newCat');
  (function(){
    var noneOpt = document.createElement('option');
    noneOpt.value = ''; noneOpt.textContent = '(카테고리 없음)';
    newCatEl.appendChild(noneOpt);
  })();
  Object.keys(CATEGORIES).forEach(function(k){
    var opt = document.createElement('option');
    opt.value = k; opt.textContent = CATEGORIES[k].label;
    newCatEl.appendChild(opt);
  });

  var newStartPicker = makeTimePicker(null);
  var newEndPicker = makeTimePicker(null);
  document.getElementById('newStartPick').appendChild(newStartPicker.el);
  document.getElementById('newEndPick').appendChild(newEndPicker.el);
  newStartPicker.el.addEventListener('timepick-change', function(){
    var s = newStartPicker.getValue();
    if (s) newEndPicker.setValue(addOneHour(s));
  });

  // 타임라인의 빈 자리를 클릭하면 그 위치에 바로 1시간짜리 항목 초안 블록이 생기고,
  // 그 블록 안에서 카테고리·내용·반복 요일을 정해서 저장할 수 있다. 기존 블록을 클릭한 건
  // 여기서 무시 (그건 그 블록 자체의 편집 클릭으로 처리됨).
  document.getElementById('timelineTrack').addEventListener('click', function(e){
    if (e.target.closest('.timeline-block')) return;
    var rect = e.currentTarget.getBoundingClientRect();
    var offsetY = e.clientY - rect.top;
    var rawMin = TIMELINE_START_MIN + (offsetY / PX_PER_HOUR) * 60;
    var snapped = Math.round(rawMin / 5) * 5;
    if (snapped < TIMELINE_START_MIN) snapped = TIMELINE_START_MIN;
    if (snapped > TIMELINE_END_MIN - 5) snapped = TIMELINE_END_MIN - 5;
    var h = Math.floor(snapped / 60), m = snapped % 60;
    var hm = (h < 10 ? '0'+h : ''+h) + ':' + (m < 10 ? '0'+m : ''+m);
    draftEntry = { cat: '', text: '', start: hm, end: addOneHour(hm) };
    editingId = 'draft';
    render();
  });

  function offsetToDate(dayKey){
    // find the nearest date (today or within next 6 days) matching this weekday,
    // so checks are scoped to a specific real date, not just a weekday label
    var targetDow = ORDER.indexOf(dayKey) === -1 ? DAY_KEYS.indexOf(dayKey) : (ORDER.indexOf(dayKey)+1)%7;
    var d = new Date(today);
    var diff = (targetDow - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function itemId(dayKey, idx, text){ return dayKey + '_' + idx + '_' + text.length; }

  function render(){
    navEl.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-day') === selectedDay);
    });

    var d = offsetToDate(selectedDay);
    var dk = dateKey(d);

    document.getElementById('panelDay').textContent = DAY_LABELS[selectedDay] + '요일' + (selectedDay===todayDayKey ? ' · 오늘' : '');
    document.getElementById('panelDate').textContent = (d.getMonth()+1)+'월 '+d.getDate()+'일';

    var baseList = template[selectedDay] || [];
    var extraList = extra[dk] || [];
    var calList = (selectedDay === todayDayKey) ? Object.keys(CATEGORY_CALENDAR).reduce(function(acc, cat){
      return acc.concat(calendarEvents[cat] || []);
    }, []) : [];
    var combined = baseList.map(function(it, idx){
      return { it: it, id: itemId(selectedDay, idx, it.text), src: 'template', idx: idx };
    }).concat(extraList.map(function(it, idx){
      return { it: it, id: 'extra_' + dk + '_' + idx, src: 'extra', idx: idx };
    })).concat(calList.map(function(entry){
      return { it: entry.it, id: entry.id, src: 'gcal' };
    })).filter(function(entry){ return !removed[dk + '__' + entry.id]; });
    if (draftEntry) combined.push({ it: draftEntry, id: 'draft', src: 'draft' });

    // 이 항목이 속한 원본 배열에 쓰기 (편집·삭제용) — gcal 항목은 편집 불가
    function writeBack(entry, patch){
      if (entry.src === 'template') {
        var arr = template[selectedDay];
        arr[entry.idx] = Object.assign({}, arr[entry.idx], patch);
        templateTs = templateStore.save(template);
      } else if (entry.src === 'extra') {
        var arr2 = extra[dk];
        arr2[entry.idx] = Object.assign({}, arr2[entry.idx], patch);
        extraTs = extraStore.save(extra);
      }
    }

    // 체크박스 · 삭제 · (편집 가능하면) 클릭 편집까지 공통으로 처리하는 항목 하나 생성
    function buildEntryEl(entry, tag){
      var it = entry.it, id = entry.id;
      var checkKey = dk + '__' + id;
      var isChecked = !!checks[checkKey];
      var cat = it.cat ? (CATEGORIES[it.cat] || { label: it.cat, color:'#999' }) : { label: '', color:'#c9c2b6' };
      var editable = entry.src === 'template' || entry.src === 'extra';
      var isDraft = entry.src === 'draft';

      var el = document.createElement(tag);
      el.className = (tag === 'li' ? 'item' : 'timeline-block') + (isChecked ? ' checked' : '') + (entry.src === 'gcal' ? ' gcal' : '');
      el.style.setProperty('--cat-color', cat.color);

      if ((editable && editingId === id) || isDraft) {
        var form = document.createElement('div');
        form.className = 'block-edit';
        var draftCatEl = null;
        if (isDraft) {
          draftCatEl = document.createElement('select');
          var noneOpt2 = document.createElement('option');
          noneOpt2.value = ''; noneOpt2.textContent = '(카테고리 없음)';
          draftCatEl.appendChild(noneOpt2);
          Object.keys(CATEGORIES).forEach(function(k){
            var opt2 = document.createElement('option');
            opt2.value = k; opt2.textContent = CATEGORIES[k].label;
            draftCatEl.appendChild(opt2);
          });
          draftCatEl.value = it.cat || '';
          draftCatEl.addEventListener('click', function(e){ e.stopPropagation(); });
          draftCatEl.addEventListener('change', function(e){
            e.stopPropagation();
            el.style.setProperty('--cat-color', (CATEGORIES[draftCatEl.value] || { color:'#c9c2b6' }).color);
          });
        }
        var textInput = document.createElement('input');
        textInput.type = 'text'; textInput.value = it.text; textInput.placeholder = '무엇을 하시나요?';
        var timeRow = document.createElement('div');
        timeRow.className = 'time-row';
        var startPicker = makeTimePicker(it.start);
        var endPicker = makeTimePicker(it.end);
        startPicker.el.addEventListener('timepick-change', function(){
          var s = startPicker.getValue();
          if (s) endPicker.setValue(addOneHour(s));
        });
        var tilde = document.createElement('span');
        tilde.className = 'tilde';
        tilde.textContent = '~';
        timeRow.appendChild(startPicker.el);
        timeRow.appendChild(tilde);
        timeRow.appendChild(endPicker.el);

        // 반복 요일 — 매주 이 요일들에 이 항목을 그대로 반복시킬지 고르는 토글.
        // 구글 캘린더처럼 "몇 주마다/언제까지"는 없고, 이 앱 구조상 "그 요일 템플릿에 있나 없나"로만 표현됨.
        var dayToggles = null;
        if (entry.src === 'template' || isDraft) {
          var origSig = itemSig(it);
          var activeDays = isDraft ? [selectedDay] : DAY_KEYS.filter(function(dkk){ return (template[dkk] || []).some(function(x){ return itemSig(x) === origSig; }); });
          var repeatRow = document.createElement('div');
          repeatRow.className = 'repeat-row';
          var repeatLabelEl = document.createElement('div');
          repeatLabelEl.className = 'repeat-label';
          repeatLabelEl.textContent = '반복 요일';
          var dayBtnWrap = document.createElement('div');
          dayBtnWrap.className = 'repeat-days';
          dayToggles = {};
          DAY_KEYS.forEach(function(dkk){
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'day-toggle' + (activeDays.indexOf(dkk) !== -1 ? ' on' : '');
            b.textContent = DAY_LABELS[dkk];
            b.addEventListener('click', function(e){ e.stopPropagation(); b.classList.toggle('on'); });
            dayToggles[dkk] = b;
            dayBtnWrap.appendChild(b);
          });
          repeatRow.appendChild(repeatLabelEl);
          repeatRow.appendChild(dayBtnWrap);
        }

        var btnRow = document.createElement('div');
        btnRow.className = 'edit-btns';
        var saveBtn = document.createElement('button');
        saveBtn.type = 'button'; saveBtn.className = 'save'; saveBtn.textContent = '저장';
        saveBtn.addEventListener('click', function(e){
          e.stopPropagation();
          var newText = textInput.value.trim();
          if (!newText) return;
          var newStart = startPicker.getValue(), newEnd = endPicker.getValue();

          if (isDraft) {
            var draftCat = draftCatEl.value;
            var draftContent = item(draftCat, newText, newStart, newEnd);
            DAY_KEYS.forEach(function(dkk){
              if (!dayToggles[dkk].classList.contains('on')) return;
              template[dkk] = template[dkk] || [];
              template[dkk].push(draftContent);
            });
            templateTs = templateStore.save(template);
            draftEntry = null;
          } else if (entry.src === 'template' && dayToggles) {
            var origSig2 = itemSig(it);
            var newContent = item(it.cat, newText, newStart, newEnd);
            DAY_KEYS.forEach(function(dkk){
              var isOn = dayToggles[dkk].classList.contains('on');
              var arr = template[dkk] = template[dkk] || [];
              if (dkk === selectedDay) {
                // 지금 편집 중인 바로 그 항목
                if (isOn) arr[entry.idx] = newContent;
                else arr.splice(entry.idx, 1);
                return;
              }
              var matchIdx = -1;
              for (var i = 0; i < arr.length; i++){ if (itemSig(arr[i]) === origSig2) { matchIdx = i; break; } }
              if (isOn && matchIdx === -1) arr.push(newContent);
              else if (isOn && matchIdx !== -1) arr[matchIdx] = newContent;
              else if (!isOn && matchIdx !== -1) arr.splice(matchIdx, 1);
            });
            templateTs = templateStore.save(template);
          } else {
            writeBack(entry, { text: newText, start: newStart, end: newEnd });
          }
          editingId = null;
          render();
        });
        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button'; cancelBtn.className = 'cancel'; cancelBtn.textContent = '취소';
        cancelBtn.addEventListener('click', function(e){
          e.stopPropagation();
          if (isDraft) draftEntry = null;
          editingId = null;
          render();
        });
        btnRow.appendChild(saveBtn);
        btnRow.appendChild(cancelBtn);
        if (draftCatEl) form.appendChild(draftCatEl);
        form.appendChild(textInput);
        form.appendChild(timeRow);
        if (repeatRow) form.appendChild(repeatRow);
        form.appendChild(btnRow);
        el.appendChild(form);
        return el;
      }

      var row1 = document.createElement('div');
      row1.className = 'row1';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = isChecked;
      cb.style.setProperty('--cat-color', cat.color);
      cb.addEventListener('click', function(e){ e.stopPropagation(); });
      cb.addEventListener('change', function(){
        checks[checkKey] = cb.checked;
        checksTs = checksStore.save(checks);
        render();
      });

      var textWrap = document.createElement('div');
      textWrap.style.flex = '1';
      if (cat.label) {
        var label = document.createElement('span');
        label.className = 'cat-label';
        label.style.setProperty('--cat-color', cat.color);
        label.textContent = cat.label;
        textWrap.appendChild(label);
      }
      var text = document.createElement('span');
      text.className = 'text';
      text.textContent = it.text;
      textWrap.appendChild(text);

      row1.appendChild(cb);
      row1.appendChild(textWrap);
      el.appendChild(row1);

      if (editable) {
        el.addEventListener('click', function(){ editingId = id; render(); });
      }

      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.title = '이 항목 삭제 (이 날짜에만 적용)';
      delBtn.addEventListener('click', function(e){
        e.stopPropagation();
        removed[checkKey] = true;
        removedTs = removedStore.save(removed);
        render();
      });
      el.appendChild(delBtn);

      return el;
    }

    var timedEntries = [], untimedEntries = [];
    combined.forEach(function(entry){
      if (entry.it.start && entry.it.end) timedEntries.push(entry); else untimedEntries.push(entry);
    });

    // -- 타임라인 (시간 있는 항목) --
    var hoursEl = document.getElementById('timelineHours');
    var trackEl = document.getElementById('timelineTrack');
    hoursEl.innerHTML = '';
    trackEl.innerHTML = '';
    var trackHeight = (TIMELINE_END_MIN - TIMELINE_START_MIN) / 60 * PX_PER_HOUR;
    trackEl.style.height = trackHeight + 'px';
    hoursEl.style.height = trackHeight + 'px';
    for (var hr = TIMELINE_START_MIN / 60; hr <= TIMELINE_END_MIN / 60; hr++){
      var top = (hr * 60 - TIMELINE_START_MIN) / 60 * PX_PER_HOUR;
      var hrLabel = document.createElement('div');
      hrLabel.className = 'hr';
      hrLabel.style.top = top + 'px';
      hrLabel.textContent = hr + '시';
      hoursEl.appendChild(hrLabel);
      if (hr < TIMELINE_END_MIN / 60) {
        var gl = document.createElement('div');
        gl.className = 'gridline';
        gl.style.top = top + 'px';
        trackEl.appendChild(gl);
      }
    }
    var laidOut = layoutTimedEntries(timedEntries);
    laidOut.forEach(function(row){
      var top2 = (row.s - TIMELINE_START_MIN) / 60 * PX_PER_HOUR;
      var height = Math.max(54, (row.en - row.s) / 60 * PX_PER_HOUR - 2);
      var widthPct = 100 / row.cols;
      var leftPct = row.col * widthPct;
      var block = buildEntryEl(row.entry, 'div');
      block.style.top = top2 + 'px';
      block.style.left = 'calc(' + leftPct + '% + 2px)';
      block.style.width = 'calc(' + widthPct + '% - 4px)';
      if (editingId === row.entry.id) {
        block.style.height = 'auto';
        block.style.minHeight = height + 'px';
        block.style.overflow = 'visible';
        block.style.zIndex = '5';
        block.style.width = 'calc(100% - 4px)';
        block.style.left = '2px';
      } else {
        block.style.height = height + 'px';
      }
      trackEl.appendChild(block);
    });

    // -- 시간 미정 목록 --
    var listEl = document.getElementById('itemList');
    var unschedLabelEl = document.getElementById('unschedLabel');
    listEl.innerHTML = '';
    unschedLabelEl.hidden = !untimedEntries.length;
    untimedEntries.forEach(function(entry){
      listEl.appendChild(buildEntryEl(entry, 'li'));
    });
    if (!combined.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '등록된 항목이 없습니다. 아래에서 추가해 보세요.';
      listEl.appendChild(empty);
    }

    var doneCount = 0;
    combined.forEach(function(entry){
      if (checks[dk + '__' + entry.id]) doneCount++;
    });

    document.getElementById('progressLine').textContent =
      combined.length ? (doneCount + ' / ' + combined.length + ' 완료') : '';

    // legend: only categories actually used today
    var legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';
    var usedCats = [];
    combined.forEach(function(entry){ if (usedCats.indexOf(entry.it.cat) === -1) usedCats.push(entry.it.cat); });
    usedCats.forEach(function(ck){
      var cat = CATEGORIES[ck]; if (!cat) return;
      var row = document.createElement('span');
      row.className = 'dot-row';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.setProperty('--dot-color', cat.color);
      row.appendChild(dot);
      row.appendChild(document.createTextNode(cat.label));
      legendEl.appendChild(row);
    });
  }

  document.getElementById('addBtn').addEventListener('click', function(){
    var textEl = document.getElementById('newText');
    var val = (textEl.value || '').trim();
    if (!val) return;
    var cat = newCatEl.value;
    var repeat = document.getElementById('newRepeat').value;
    var start = newStartPicker.getValue();
    var end = newEndPicker.getValue();

    if (repeat === 'daily') {
      DAY_KEYS.forEach(function(dk2){
        template[dk2] = template[dk2] || [];
        template[dk2].push(item(cat, val, start, end));
      });
      templateTs = templateStore.save(template);
    } else if (repeat === 'once') {
      var dk = dateKey(offsetToDate(selectedDay));
      extra[dk] = extra[dk] || [];
      extra[dk].push(item(cat, val, start, end));
      extraTs = extraStore.save(extra);
    } else {
      template[selectedDay] = template[selectedDay] || [];
      template[selectedDay].push(item(cat, val, start, end));
      templateTs = templateStore.save(template);
    }
    textEl.value = '';
    newStartPicker.setValue(null);
    newEndPicker.setValue(null);
    render();
  });
  document.getElementById('newText').addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });

  render();
  initCalendarSync();

  // 다른 기기에서 바뀐 게 있으면 맞춰서 다시 그린다 (이 기기가 처음이면 지금 값을 db로 올린다).
  // getCurrent는 반드시 "지금" 값을 새로 읽어서 반환해야 함 — 응답이 오는 사이 사용자가
  // 체크·삭제했을 수 있어서, reconcile 호출 시점의 값을 그대로 캡처해두면 안 됨.
  templateStore.reconcile(function(){ return { value: template, ts: templateTs }; }, function(remoteValue, ts){
    template = remoteValue; templateTs = ts;
    DAY_KEYS.forEach(function(k){ if (!template[k]) template[k] = DEFAULT_TEMPLATE[k] || []; });
    render();
  });
  checksStore.reconcile(function(){ return { value: checks, ts: checksTs }; }, function(remoteValue, ts){ checks = remoteValue; checksTs = ts; render(); });
  removedStore.reconcile(function(){ return { value: removed, ts: removedTs }; }, function(remoteValue, ts){ removed = remoteValue; removedTs = ts; render(); });
  extraStore.reconcile(function(){ return { value: extra, ts: extraTs }; }, function(remoteValue, ts){ extra = remoteValue; extraTs = ts; render(); });
  routineV2Store.reconcile(function(){ return { value: routineV2Applied, ts: routineV2Ts }; }, function(remoteValue, ts){ routineV2Applied = remoteValue; routineV2Ts = ts; });
  routineInputStore.reconcile(function(){ return { value: routineInputApplied, ts: routineInputTs }; }, function(remoteValue, ts){ routineInputApplied = remoteValue; routineInputTs = ts; });
  routineHealthStore.reconcile(function(){ return { value: routineHealthApplied, ts: routineHealthTs }; }, function(remoteValue, ts){ routineHealthApplied = remoteValue; routineHealthTs = ts; });
})();
</script>


<script>
(function(){
  if (window.__wordTooltipInit) return;
  window.__wordTooltipInit = true;

  var BOOK_INDEX = {"창세기":1, "출애굽기":2, "레위기":3, "민수기":4, "신명기":5, "여호수아":6, "사사기":7, "룻기":8, "사무엘상":9, "사무엘하":10, "열왕기상":11, "열왕기하":12, "역대상":13, "역대하":14, "에스라":15, "느헤미야":16, "에스더":17, "욥기":18, "시편":19, "잠언":20, "전도서":21, "아가":22, "이사야":23, "예레미야":24, "예레미야애가":25, "에스겔":26, "다니엘":27, "호세아":28, "요엘":29, "아모스":30, "오바댜":31, "요나":32, "미가":33, "나훔":34, "하박국":35, "스바냐":36, "학개":37, "스가랴":38, "말라기":39, "마태복음":40, "마가복음":41, "누가복음":42, "요한복음":43, "사도행전":44, "로마서":45, "고린도전서":46, "고린도후서":47, "갈라디아서":48, "에베소서":49, "빌립보서":50, "골로새서":51, "데살로니가전서":52, "데살로니가후서":53, "디모데전서":54, "디모데후서":55, "디도서":56, "빌레몬서":57, "히브리서":58, "야고보서":59, "베드로전서":60, "베드로후서":61, "요한일서":62, "요한이서":63, "요한삼서":64, "유다서":65, "요한계시록":66};

  var SAMPLE_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('sample')
    : Promise.resolve(null);
  var VOCAB_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  function speakKorean(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function escHtml(s){
    return String(s || '').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
  }
  function pad(n, w){ n = String(n); while (n.length < w) n = '0' + n; return n; }
  function chapterDocId(book, chapter){
    var num = BOOK_INDEX[book];
    if (!num) return null;
    return pad(num, 2) + '-' + pad(chapter, 3);
  }
  function resolveVerses(db, refs){
    if (!db || !refs || !refs.length) return Promise.resolve([]);
    return Promise.all(refs.map(function(ref){
      var docId = chapterDocId(ref.book, ref.chapter);
      if (!docId) return null;
      return db.doc('bible/' + docId).get().then(function(snap){
        if (!snap.exists) return null;
        var data = snap.data();
        var start = ref.start || 1;
        var end = ref.end || start;
        var matched = (data.verses || []).filter(function(v){
          var n = parseInt(v.n, 10);
          return n >= start && n <= end;
        });
        if (!matched.length) return null;
        var label = ref.book + ' ' + ref.chapter + ':' + start + (end !== start ? '-' + end : '');
        var text = matched.map(function(v){ return v.n + '. ' + v.t; }).join(' ');
        return { label: label, text: text };
      }).catch(function(){ return null; });
    })).then(function(results){ return results.filter(Boolean); });
  }

  var tooltipEl = null;
  function ensureTooltip(){
    if (tooltipEl) return tooltipEl;
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    tooltipEl.innerHTML = '<div class="wt-head"><span class="wt-word"></span><button type="button" class="wt-speak" title="발음 듣기">\ud83d\udd0a</button></div><div class="wt-body"></div><div class="wt-extra"></div><div class="wt-badge" hidden></div>';
    document.body.appendChild(tooltipEl);
    tooltipEl.querySelector('.wt-speak').addEventListener('click', function(){
      speakKorean(tooltipEl.querySelector('.wt-word').textContent);
    });
    return tooltipEl;
  }
  function hideTooltip(){ if (tooltipEl) tooltipEl.classList.remove('open'); }
  function positionTooltip(rect){
    var el = ensureTooltip();
    var top = window.scrollY + rect.bottom + 8;
    var left = window.scrollX + rect.left;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 16;
    if (left > maxLeft) left = Math.max(12, maxLeft);
    if (left < 12) left = 12;
    el.style.top = top + 'px';
    el.style.left = left + 'px';
  }
  function vocabKey(word){ return 'vocab/' + encodeURIComponent(word); }
  function renderExtra(el, entry){
    var parts = [];
    if (entry.verses && entry.verses.length){
      var vRows = entry.verses.map(function(vb){
        return '<div class="wt-verse-block"><b>' + escHtml(vb.label) + '</b><div class="wt-verse-text">' + escHtml(vb.text) + '</div></div>';
      }).join('');
      parts.push('<div class="wt-verses">\ud83d\udcd6 관련 구절' + vRows + '</div>');
    }
    if (entry.related && entry.related.length){
      var rows = entry.related.map(function(r2){
        return '<div>· <b>' + escHtml(r2.word) + '</b>' + (r2.nuance ? ' — ' + escHtml(r2.nuance) : '') + '</div>';
      }).join('');
      parts.push('<div class="wt-related"><b>\ud83d\udd17 비슷한 단어</b>' + rows + '</div>');
    }
    el.innerHTML = parts.join('');
  }
  function lookupWord(word){
    return VOCAB_DB_PROMISE.then(function(db){
      if (!db) return { db: null, hit: null };
      return db.doc(vocabKey(word)).get().then(function(snap){
        return { db: db, hit: (snap && snap.exists) ? snap.data() : null };
      }).catch(function(){ return { db: db, hit: null }; });
    }).then(function(r){
      if (r.hit) return Object.assign({ cached: true }, r.hit);
      return SAMPLE_PROMISE.then(function(sample){
        if (!sample) return null;
        return sample.json(
          '아래 한국어 단어 또는 구절을 성경 본문에서 만났다. 다음 JSON 형식으로만 답해라(다른 설명 없이):\n' +
          '{"definition": "2~3문장의 기본 뜻, 신앙·성경 맥락 고려, 인사말 없이", "verses": [{"book": "사도행전", "chapter": 16, "start": 31, "end": 34}], "related": [{"word": "비슷한 뜻이지만 뉘앙스가 다른 단어", "nuance": "그 차이를 1문장으로"}]}\n' +
          'verses의 book은 정확한 개역한글 성경 책 이름 하나(창세기~요한계시록 중), chapter/start/end는 숫자. 이 단어와 실제로 관련 있는 구절 1~2개만 골라라. 원어(히브리어/헬라어)나 번역에 따라 뜻이 갈리는 지점이 있으면 definition이나 nuance에 녹여라. related는 뜻은 비슷하지만 결이 다른 단어 0~3개, 없으면 빈 배열.\n\n단어: ' + word,
          { modelTier: 'quick' }
        ).then(function(data){
          var definition = String((data && data.definition) || '').trim();
          var refs = Array.isArray(data && data.verses) ? data.verses.filter(function(v){
            return v && v.book && BOOK_INDEX[v.book] && v.chapter;
          }).map(function(v){
            return { book: String(v.book), chapter: Number(v.chapter), start: Number(v.start || 1), end: Number(v.end || v.start || 1) };
          }) : [];
          var related = Array.isArray(data && data.related)
            ? data.related.filter(function(r2){ return r2 && r2.word; }).map(function(r2){ return { word: String(r2.word), nuance: String(r2.nuance || '') }; })
            : [];
          return resolveVerses(r.db, refs).then(function(verseBlocks){
            var entry = { word: word, definition: definition, verses: verseBlocks, related: related, createdAt: Date.now(), box: 1, nextReview: Date.now() };
            if (r.db){ r.db.doc(vocabKey(word)).set(entry).catch(function(){}); }
            return Object.assign({ cached: false }, entry);
          });
        });
      });
    });
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  var pending = 0;
  function handleSelection(){
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text || text.length < 1 || text.length > 30 || text.indexOf('\n') !== -1){ hideTooltip(); return; }
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (isInsideFormField(range.commonAncestorContainer)){ hideTooltip(); return; }
    var rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    var el = ensureTooltip();
    el.querySelector('.wt-word').textContent = text;
    el.querySelector('.wt-body').textContent = '뜻을 찾는 중...';
    el.querySelector('.wt-extra').innerHTML = '';
    var badge = el.querySelector('.wt-badge');
    badge.hidden = true;
    el.classList.add('open');
    positionTooltip(rect);

    var myTicket = ++pending;
    lookupWord(text).then(function(result){
      if (myTicket !== pending) return;
      if (!result){
        el.querySelector('.wt-body').textContent = '이 기능은 Claude 아티팩트 화면에서만 동작해요.';
        return;
      }
      el.querySelector('.wt-body').textContent = result.definition;
      renderExtra(el.querySelector('.wt-extra'), result);
      badge.hidden = false;
      badge.className = 'wt-badge' + (result.cached ? ' cached' : '');
      badge.textContent = result.cached ? '⚡ 단어장에서 바로 불러왔어요 (무료)' : '✓ 단어장에 저장했어요';
    }).catch(function(){
      if (myTicket !== pending) return;
      el.querySelector('.wt-body').textContent = '뜻을 가져오지 못했어요.';
    });
  }
  document.addEventListener('mouseup', function(e){
    if (e.button !== 0) return;
    if (e.target && e.target.closest && (e.target.closest('.word-tooltip') || e.target.closest('.select-menu'))) return;
    setTimeout(handleSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!(e.target && e.target.closest && e.target.closest('.word-tooltip'))) hideTooltip();
  });
  document.addEventListener('scroll', hideTooltip, true);
})();
</script>


<script>
(function(){
  if (window.__quoteSaveInit) return;
  window.__quoteSaveInit = true;

  var QUOTES_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  var menuEl = null;
  function ensureMenu(){
    if (menuEl) return menuEl;
    menuEl = document.createElement('div');
    menuEl.className = 'select-menu';
    menuEl.innerHTML = '<button type="button" class="sm-save">\ud83d\udccc 이 구절 저장하기</button>';
    document.body.appendChild(menuEl);
    return menuEl;
  }
  function hideMenu(){ if (menuEl) menuEl.classList.remove('open'); }
  function captureBibleRef(sel){
    try {
      if (!sel || !sel.rangeCount) return null;
      var range = sel.getRangeAt(0);
      var anchor = sel.anchorNode;
      var anchorEl = anchor && anchor.nodeType === 1 ? anchor : (anchor ? anchor.parentElement : null);
      var dayEl = anchorEl && anchorEl.closest ? anchorEl.closest('.reading-day') : null;
      if (!dayEl) return null;
      var bookKr = dayEl.getAttribute('data-book-kr');
      var bookEn = dayEl.getAttribute('data-book-en');
      var chapter = dayEl.getAttribute('data-chapter');
      if (!bookKr || !chapter) return null;
      var verses = [];
      dayEl.querySelectorAll('.rv[data-verse]').forEach(function(rv){
        if (!range.intersectsNode(rv)) return;
        var koEl = rv.querySelector('.ko');
        var enEl = rv.querySelector('.en');
        verses.push({
          n: parseInt(rv.getAttribute('data-verse'), 10) || 0,
          ko: koEl ? koEl.textContent.replace(/^\s*\d+\s*/, '').trim() : '',
          en: enEl ? enEl.textContent.trim() : ''
        });
      });
      if (!verses.length) return null;
      verses.sort(function(a,b){ return a.n - b.n; });
      var vMin = verses[0].n, vMax = verses[verses.length - 1].n;
      return {
        bookKr: bookKr,
        bookEn: bookEn,
        chapter: parseInt(chapter, 10),
        verseStart: vMin,
        verseEnd: vMax,
        label: bookKr + ' ' + chapter + '\uc7a5 ' + vMin + (vMax > vMin ? '-' + vMax : '') + '\uc808',
        labelEn: (bookEn || '') + ' ' + chapter + ':' + vMin + (vMax > vMin ? '-' + vMax : ''),
        koText: verses.map(function(v){ return v.n + '. ' + v.ko; }).join('\n'),
        enText: verses.map(function(v){ return v.n + '. ' + v.en; }).join('\n')
      };
    } catch (err) { return null; }
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  function positionMenu(menu, x, y){
    var maxLeft = window.scrollX + document.documentElement.clientWidth - menu.offsetWidth - 8;
    var left = Math.min(x, Math.max(8, maxLeft));
    menu.style.left = left + 'px';
    menu.style.top = y + 'px';
  }
  function saveQuote(text, btn, bibleRef){
    QUOTES_DB_PROMISE.then(function(db){
      if (!db) return;
      var id = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      var entry = {
        text: text,
        source: (document.title || '').replace(/\s+/g, ' ').trim(),
        createdAt: Date.now()
      };
      if (bibleRef) entry.bibleRef = bibleRef;
      db.doc('quotes/' + id).set(entry).then(function(){
        document.dispatchEvent(new CustomEvent('solomon-quote-saved', { detail: entry }));
      }).catch(function(){});
    });
    if (btn) btn.textContent = '\u2713 저장했어요';
    setTimeout(hideMenu, 700);
  }
  document.addEventListener('contextmenu', function(e){
    if (isInsideFormField(e.target)) return;
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text) { hideMenu(); return; }
    e.preventDefault();
    var bibleRef = captureBibleRef(sel);
    var menu = ensureMenu();
    var btn = menu.querySelector('.sm-save');
    btn.textContent = '\ud83d\udccc 이 구절 저장하기';
    menu.classList.add('open');
    positionMenu(menu, window.scrollX + e.clientX, window.scrollY + e.clientY);
    btn.onclick = function(){ saveQuote(text, btn, bibleRef); };
  });
  document.addEventListener('click', function(e){
    if (menuEl && !(e.target.closest && e.target.closest('.select-menu'))) hideMenu();
  });
  document.addEventListener('scroll', hideMenu, true);
})();
</script>
