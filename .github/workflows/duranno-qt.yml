name: Duranno QT 자동 수집

on:
  schedule:
    # 00:20 KST — 두란노가 자정 직후 당일 콘텐츠를 올려주는 시점
    - cron: '20 15 * * *'
    # 06:00 KST — 위 시도가 실패했을 때를 위한 재시도
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run fetch-duranno

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/qt
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: 두란노 QT 자동 수집"
            git push
          fi
