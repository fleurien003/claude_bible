<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>오늘의 통독</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Square:wght@400;700;800&display=swap');

  :root{
    --bg-void:#100e1c;
    --bg-glow:#2c2544;
    --sky-mid:#17132a;
    --gold:#c9a24b;
    --gold-bright:#eccd85;
    --parchment:#ecdfc2;
    --parchment-edge:#d8c69a;
    --ink:#2c2013;
    --ink-soft:#6b5636;
    --cedar:#5b3324;
    --pomegranate:#8a3b3b;
    --star:#f5ecd6;
    --mh-accent:#eccd85;
    --mh-title:#f7efd8;
    --mh-title-glow:rgba(230,190,110,.25);
    --mh-line:rgba(230,190,110,.3);
    --mh-nav-bg:rgba(20,17,34,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0; background:var(--bg-void); color:var(--ink);
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .sky{
    position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse 80% 50% at 50% 100%, var(--bg-glow), transparent 70%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--sky-mid) 55%, var(--bg-glow) 100%);
    transition:background 2s ease;
    pointer-events:none;
  }
  .wrap{ position:relative; z-index:1; max-width:720px; margin:0 auto; padding:44px 18px 70px; }

  .masthead{ text-align:center; color:var(--star); margin-bottom:28px; transition:color 2s ease; }
  .eyebrow{ font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--mh-accent); opacity:.9; margin-bottom:8px; transition:color 2s ease; }
  h1.title{
    font-family:'Song Myung','Nanum Myeongjo',serif; font-weight:400;
    font-size:clamp(28px,6.5vw,40px); margin:0 0 8px; color:var(--mh-title);
    text-shadow:0 0 24px var(--mh-title-glow);
    transition:color 2s ease, text-shadow 2s ease;
  }
  .sub{ font-size:14px; color:var(--mh-accent); opacity:.85; transition:color 2s ease; }
  a.back{
    display:inline-block; margin-top:14px; font-size:12.5px; color:var(--mh-accent);
    text-decoration:none; border-bottom:1px solid var(--mh-line);
    transition:color 2s ease, border-color 2s ease;
  }

  .scroll{
    position:relative; background:var(--parchment); color:var(--ink);
    padding:36px clamp(20px,6vw,48px) 32px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
    transition:background-color 1.5s ease;
  }

  .kicker{ font-size:12px; letter-spacing:.28em; font-weight:600; color:var(--pomegranate); margin-bottom:8px; }
  h2{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-weight:400; font-size:clamp(22px,4.4vw,28px); margin:0 0 18px; color:var(--cedar); }

  .reading-day{ background:var(--parchment); border:1px solid var(--parchment-edge); margin:0 0 14px; }
  .reading-day .head{ padding:13px 16px; }
  .reading-day .ref{ font-weight:700; color:var(--cedar); font-size:15.5px; }
  .reading-day .ref .en-name{ font-weight:400; color:var(--ink-soft); font-size:12.5px; }
  .reading-day .body{ padding:0 16px 16px; border-top:1px dashed var(--parchment-edge); }
  .rv{ margin:14px 0 0; }
  .rv .ko{ font-size:15.5px; color:var(--ink); margin:0; }
  .rv .en{ font-size:13px; color:var(--ink-soft); font-style:italic; margin:3px 0 0; }
  .rv sup{ font-size:11px; color:var(--gold); font-weight:600; margin-right:4px; }
  .gnote{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }

  .qt-loading, .qt-error{ margin:0; font-size:15px; color:var(--ink-soft); font-style:italic; }
  .retry-btn{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:12.5px; font-weight:500;
    background:transparent; color:var(--cedar); border:1px solid var(--cedar);
    padding:7px 14px; cursor:pointer; margin-top:6px;
  }
  .retry-btn:hover{ background:var(--cedar); color:#f7efd8; }

  .meditate{ margin-top:30px; padding-top:24px; border-top:1px dashed var(--parchment-edge); }
  .meditate .label{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:11.5px; letter-spacing:.2em; color:var(--ink-soft); font-weight:600; margin-bottom:14px; }

  .date-picker-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 8px; }
  .date-picker-row input[type="date"]{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:14px; padding:8px 10px;
    border:1px solid var(--parchment-edge); background:#f7f1de; color:var(--ink);
  }
  .date-picker-row button{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13px; font-weight:500; letter-spacing:.03em;
    background:transparent; color:var(--cedar); border:1px solid var(--cedar); padding:8px 16px; cursor:pointer;
  }
  .date-picker-row button:hover{ background:var(--cedar); color:#f7efd8; }
  .viewing-date{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .viewing-date b{ color:var(--pomegranate); font-weight:600; }
  ol.questions{ margin:0 0 20px; padding-left:20px; }
  ol.questions li{ font-size:16px; color:var(--ink); margin-bottom:10px; }
  .journal textarea{
    width:100%; min-height:110px; resize:vertical;
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:16px; line-height:1.75; color:var(--ink);
    background:#f7f1de; border:1px solid var(--parchment-edge);
    padding:14px 16px; margin-bottom:12px;
  }
  .journal textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .journal-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .journal button{
    font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:13.5px; letter-spacing:.05em; font-weight:500;
    background:var(--cedar); color:#f7efd8; border:none; padding:10px 20px; cursor:pointer;
  }
  .journal button:hover{ background:#4a2a1d; }
  .journal .status{ font-family:'Nanum Square','Noto Sans KR',sans-serif; font-size:12.5px; color:var(--ink-soft); }

  footer{
    max-width:720px; margin:30px auto 0; padding-inline:18px; text-align:center;
    color:var(--mh-accent); opacity:.7; font-size:12px; position:relative; z-index:1;
    transition:color 2s ease;
  }

  @media (max-width:480px){ .scroll{ padding-inline:20px; } }

  .word-tooltip{
    position:absolute; z-index:9999; max-width:280px; min-width:180px;
    background:var(--parchment,#ecdfc2); border:1px solid var(--gold,#c9a24b); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.28); padding:12px 14px;
    font-family:'Nanum Square','Noto Sans KR',sans-serif;
    opacity:0; transform:translateY(4px); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .word-tooltip.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .word-tooltip .wt-word{ font-weight:700; font-size:14px; color:var(--ink,#2c2013); margin-bottom:6px; }
  .word-tooltip .wt-body{ font-size:13px; line-height:1.55; color:var(--ink-soft,#6b5636); white-space:pre-wrap; }
  .word-tooltip .wt-badge{ margin-top:8px; font-size:11px; color:var(--gold,#c9a24b); font-weight:600; }
  .word-tooltip .wt-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .word-tooltip .wt-head .wt-word{ margin-bottom:0; }
  .word-tooltip .wt-speak{
    background:transparent; border:1px solid var(--parchment-edge,#d8c69a); border-radius:999px;
    font-size:12px; line-height:1; padding:4px 7px; cursor:pointer; color:var(--cedar,#5b3324); flex:none;
  }
  .word-tooltip .wt-speak:hover{ background:var(--gold,#c9a24b); color:#fff; border-color:var(--gold,#c9a24b); }
  .word-tooltip .wt-speak:disabled{ opacity:.4; cursor:default; }
  .word-tooltip .wt-extra{ margin-top:8px; font-size:12px; color:var(--ink-soft,#6b5636); }
  .word-tooltip .wt-extra .wt-verses{ margin-bottom:4px; }
  .word-tooltip .wt-extra .wt-related div{ margin-bottom:2px; }
  .word-tooltip .wt-extra b{ color:var(--cedar,#5b3324); font-weight:700; }
</style>

<div class="sky"></div>

<div class="wrap">
  <div class="masthead">
    <div class="eyebrow">매삼주오 통독</div>
    <h1 class="title">오늘의 통독</h1>
    <div class="sub" id="dateLabel"></div>
    <a class="back" href="index.html">← 솔로몬의 편지로 돌아가기</a>
  </div>

  <div class="scroll">
    <div class="kicker">오늘의 본문</div>
    <h2>말씀을 따라 걷는 길</h2>

    <div class="date-picker-row">
      <input type="date" id="viewDate">
      <button id="viewDateBtn" type="button">그 날 통독 보기</button>
      <button id="viewTodayBtn" type="button" hidden>오늘로 돌아가기</button>
    </div>
    <div class="viewing-date" id="viewingDateLabel"></div>

    <div id="readingList"><p class="qt-loading">불러오는 중…</p></div>

    <div class="meditate">
      <div class="label" id="meditateLabel">오늘의 통독 묵상</div>
      <ol class="questions" id="questionList"></ol>
      <div class="journal">
        <textarea id="readingNote" placeholder="통독하며 마음에 남은 것을 적어 보라..."></textarea>
        <div class="journal-row">
          <button id="saveReadingNote" type="button">이 날의 묵상 기록하기</button>
          <span class="status" id="readingNoteStatus"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>묵상 기록은 이 브라우저에만 저장됩니다</footer>

<script>
(function(){
  // -- 하늘 배경: 시간대에 맞춰 밤/낮/노을을 보간 (index.html과 동일 로직) --
  (function(){
    function hex(c){ return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16), 1]; }
    function rgba(c){
      var m = c.match(/rgba?\(([^)]+)\)/);
      var p = m[1].split(',').map(function(v){ return parseFloat(v); });
      return [p[0], p[1], p[2], p.length > 3 ? p[3] : 1];
    }
    function parseColor(c){ return c[0] === '#' ? hex(c) : rgba(c); }
    function lerpColor(a, b, t){
      var ca = parseColor(a), cb = parseColor(b);
      var r = ca.map(function(v, i){ return v + (cb[i] - v) * t; });
      return 'rgba(' + Math.round(r[0]) + ',' + Math.round(r[1]) + ',' + Math.round(r[2]) + ',' + (Math.round(r[3] * 1000) / 1000) + ')';
    }
    var NIGHT = {
      bgVoid:'#100e1c', skyMid:'#17132a', bgGlow:'#2c2544', star:'#f5ecd6',
      mhAccent:'#eccd85', mhTitle:'#f7efd8', mhTitleGlow:'rgba(230,190,110,.25)',
      mhLine:'rgba(230,190,110,.3)', mhNavBg:'rgba(20,17,34,.6)', textScheme:'light'
    };
    var DAY = {
      bgVoid:'#5aa8d8', skyMid:'#a9d8ef', bgGlow:'#eef8ff', star:'#33465a',
      mhAccent:'#a9701f', mhTitle:'#233140', mhTitleGlow:'rgba(255,255,255,.5)',
      mhLine:'rgba(169,112,31,.3)', mhNavBg:'rgba(255,255,255,.6)', textScheme:'dark'
    };
    var SUNSET = {
      bgVoid:'#2e2a52', skyMid:'#9c4a72', bgGlow:'#ff9c5c', star:'#fff0dd',
      mhAccent:'#ffb473', mhTitle:'#fff4e2', mhTitleGlow:'rgba(255,140,80,.4)',
      mhLine:'rgba(255,178,120,.35)', mhNavBg:'rgba(40,22,30,.55)', textScheme:'light'
    };
    // 월~목 08~18시 "위장 모드" — 회사에서 볼 때 티나지 않도록 낮 하늘을 새하얗게
    var WHITE = {
      bgVoid:'#ffffff', skyMid:'#ffffff', bgGlow:'#ffffff', star:'#2b2b2b',
      mhAccent:'#6b6b6b', mhTitle:'#1c1c1c', mhTitleGlow:'rgba(0,0,0,0)',
      mhLine:'rgba(0,0,0,.12)', mhNavBg:'rgba(0,0,0,.04)', textScheme:'dark'
    };
    var KEYS = ['bgVoid','skyMid','bgGlow','star','mhAccent','mhTitle','mhTitleGlow','mhLine','mhNavBg'];
    var TEXT_KEYS = { star:1, mhAccent:1, mhTitle:1, mhTitleGlow:1 };
    var VAR_NAME = {
      bgVoid:'--bg-void', skyMid:'--sky-mid', bgGlow:'--bg-glow', star:'--star',
      mhAccent:'--mh-accent', mhTitle:'--mh-title', mhTitleGlow:'--mh-title-glow',
      mhLine:'--mh-line', mhNavBg:'--mh-nav-bg'
    };
    function applySkyPhase(){
      var d = new Date();
      var h = d.getHours() + d.getMinutes() / 60;
      var wd = d.getDay();
      var isOfficeDay = wd >= 1 && wd <= 4;
      var dayVariant = isOfficeDay ? WHITE : DAY;
      var anchors = [[0,NIGHT],[7,NIGHT],[8,dayVariant],[18,dayVariant],[19,SUNSET],[21,NIGHT],[24,NIGHT]];
      var i = 0;
      while (i < anchors.length - 2 && h >= anchors[i + 1][0]) i++;
      var t = (h - anchors[i][0]) / (anchors[i + 1][0] - anchors[i][0]);
      var a = anchors[i][1], b = anchors[i + 1][1];
      var textT = a.textScheme !== b.textScheme ? (t < 0.5 ? 0 : 1) : t;
      var root = document.documentElement.style;
      KEYS.forEach(function(k){ root.setProperty(VAR_NAME[k], lerpColor(a[k], b[k], TEXT_KEYS[k] ? textT : t)); });
      var officeWhite = isOfficeDay && h >= 8 && h < 18;
      root.setProperty('--parchment', officeWhite ? '#ffffff' : '#ecdfc2');
      root.setProperty('--parchment-edge', officeWhite ? '#eeeeee' : '#d8c69a');
    }
    applySkyPhase();
    setInterval(applySkyPhase, 60 * 1000);
  })();

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

  var now = new Date();
  var todayKey = dateKey(now);

  var dateLabelEl = document.getElementById('dateLabel');
  if (dateLabelEl) dateLabelEl.textContent = (now.getMonth()+1)+'월 '+now.getDate()+'일';

  var DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  function renderPairedVerses(container, koVerses, enVerses){
    var max = Math.max(koVerses.length, enVerses.length);
    for (var i=0;i<max;i++){
      var kv = koVerses[i], ev = enVerses[i];
      var div = document.createElement('div');
      div.className = 'rv';
      if (kv) {
        var ko = document.createElement('p');
        ko.className = 'ko';
        var sup = document.createElement('sup');
        sup.textContent = kv.n;
        ko.appendChild(sup);
        ko.appendChild(document.createTextNode(kv.t));
        div.appendChild(ko);
      }
      if (ev) {
        var en = document.createElement('p');
        en.className = 'en';
        en.textContent = ev.t;
        div.appendChild(en);
      }
      container.appendChild(div);
    }
  }

  function buildReadingBlock(r){
    var wrap = document.createElement('div');
    wrap.className = 'reading-day';

    var head = document.createElement('div');
    head.className = 'head';
    var refSpan = document.createElement('span');
    refSpan.className = 'ref';
    refSpan.appendChild(document.createTextNode(r.book_kr + ' ' + r.chapter + '장 '));
    var enName = document.createElement('span');
    enName.className = 'en-name';
    enName.textContent = '(' + r.book_en + ' ' + r.chapter + ')';
    refSpan.appendChild(enName);
    head.appendChild(refSpan);
    wrap.appendChild(head);

    var body = document.createElement('div');
    body.className = 'body';
    if (r.translation && r.translation !== '쉬운성경') {
      var note = document.createElement('div');
      note.className = 'gnote';
      note.style.marginTop = '10px';
      note.textContent = '이 장은 쉬운성경 원문 누락으로 개역개정으로 대체되었습니다.';
      body.appendChild(note);
    }
    renderPairedVerses(body, r.koVerses || [], r.enVerses || []);
    wrap.appendChild(body);

    return wrap;
  }

  function renderQuestions(questions){
    var listEl = document.getElementById('questionList');
    if (!listEl) return;
    listEl.innerHTML = '';
    (questions && questions.length ? questions : [
      '오늘 읽은 본문에서 가장 마음에 머문 장면은 무엇인가?',
      '오늘 본문의 말씀을 오늘 하루 어떻게 적용해 보겠는가?'
    ]).forEach(function(q){
      var li = document.createElement('li');
      li.textContent = q;
      listEl.appendChild(li);
    });
  }

  function parseDateKey(k){
    var parts = (k || '').split('-').map(Number);
    return new Date(parts[0], (parts[1]||1)-1, parts[2]||1);
  }

  var selectedKey = todayKey;

  function showError(noRetry){
    var listEl = document.getElementById('readingList');
    listEl.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'qt-error';
    p.textContent = noRetry
      ? '그 날의 통독 본문이 없다. (계속 비어 있으면 페이지를 새로고침해 보라.)'
      : '통독 본문을 아직 불러오지 못했다.';
    listEl.appendChild(p);
    if (!noRetry) {
      var retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = '다시 불러오기';
      retryBtn.addEventListener('click', function(){ loadReadingFor(selectedKey); });
      listEl.appendChild(retryBtn);
    }
    renderQuestions(null);
  }

  function loadReadingFor(key){
    var listEl = document.getElementById('readingList');
    listEl.innerHTML = '<p class="qt-loading">통독 본문을 불러오는 중이니, 잠시 기다리라…</p>';
    DB_PROMISE.then(function(db){
      if (!db) { showError(true); return; }
      db.doc('reading/' + key).get().then(function(snap){
        if (!snap.exists) { showError(true); return; }
        var day = snap.data();
        listEl.innerHTML = '';
        (day.readings || []).forEach(function(r){ listEl.appendChild(buildReadingBlock(r)); });
        renderQuestions(day.questions);
      }).catch(function(){ showError(false); });
    }).catch(function(){ showError(true); });
  }

  var READING_STORAGE_KEY = 'solomonReadingJournal';
  function loadReadingJournal(){
    try {
      var raw = localStorage.getItem(READING_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveReadingJournalMap(map){
    try { localStorage.setItem(READING_STORAGE_KEY, JSON.stringify(map)); } catch (e) {}
  }
  var readingJournal = loadReadingJournal();
  var readingNoteEl = document.getElementById('readingNote');
  var readingStatusEl = document.getElementById('readingNoteStatus');
  var meditateLabelEl = document.getElementById('meditateLabel');
  var viewingDateLabelEl = document.getElementById('viewingDateLabel');
  var viewDateInput = document.getElementById('viewDate');
  var viewTodayBtn = document.getElementById('viewTodayBtn');

  function refreshJournalUI(key){
    var isToday = key === todayKey;
    if (meditateLabelEl) meditateLabelEl.textContent = isToday ? '오늘의 통독 묵상' : (key.slice(5).replace('-', '.') + '의 통독 묵상');
    if (readingNoteEl) readingNoteEl.value = (readingJournal[key] && readingJournal[key].note) || '';
    if (readingStatusEl) {
      readingStatusEl.textContent = readingJournal[key]
        ? (isToday ? '오늘 이미 기록하였습니다. 다시 저장하면 덮어씁니다.' : '이 날의 기록이 있습니다. 고쳐서 다시 저장하면 덮어씁니다.')
        : '';
    }
  }

  function updateViewingDateLabel(key){
    if (!viewingDateLabelEl) return;
    var d = parseDateKey(key);
    var isToday = key === todayKey;
    var label = (d.getMonth()+1) + '월 ' + d.getDate() + '일';
    viewingDateLabelEl.innerHTML = isToday
      ? '<b>오늘</b> · ' + label
      : '<b>' + label + '</b>의 통독을 보고 있습니다';
    if (viewTodayBtn) viewTodayBtn.hidden = isToday;
  }

  function switchToDate(key){
    if (!key) return;
    selectedKey = key;
    if (viewDateInput) viewDateInput.value = key;
    updateViewingDateLabel(key);
    loadReadingFor(key);
    refreshJournalUI(key);
  }

  if (viewDateInput) viewDateInput.value = todayKey;
  switchToDate(todayKey);

  var viewDateBtn = document.getElementById('viewDateBtn');
  if (viewDateBtn) {
    viewDateBtn.addEventListener('click', function(){
      switchToDate(viewDateInput ? viewDateInput.value : todayKey);
    });
  }
  if (viewTodayBtn) {
    viewTodayBtn.addEventListener('click', function(){ switchToDate(todayKey); });
  }

  var saveReadingBtn = document.getElementById('saveReadingNote');
  if (saveReadingBtn) {
    saveReadingBtn.addEventListener('click', function(){
      var val = readingNoteEl ? readingNoteEl.value : '';
      if (!val || !val.trim()) {
        if (readingStatusEl) readingStatusEl.textContent = '먼저 몇 마디라도 적어 보라.';
        return;
      }
      readingJournal[selectedKey] = { note: val, ts: new Date().toISOString() };
      saveReadingJournalMap(readingJournal);
      if (readingStatusEl) {
        var d = new Date();
        readingStatusEl.textContent = '저장되었습니다 · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
    });
  }
})();
</script>


<script>
(function(){
  if (window.__wordTooltipInit) return;
  window.__wordTooltipInit = true;

  var SAMPLE_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('sample')
    : Promise.resolve(null);
  var VOCAB_DB_PROMISE = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('db')
    : Promise.resolve(null);

  function speakKorean(text){
    try{
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  var tooltipEl = null;
  function ensureTooltip(){
    if (tooltipEl) return tooltipEl;
    tooltipEl = document.createElement('div');
    tooltipEl.className = 'word-tooltip';
    tooltipEl.innerHTML = '<div class="wt-head"><span class="wt-word"></span><button type="button" class="wt-speak" title="발음 듣기">\ud83d\udd0a</button></div><div class="wt-body"></div><div class="wt-extra"></div><div class="wt-badge" hidden></div>';
    document.body.appendChild(tooltipEl);
    tooltipEl.querySelector('.wt-speak').addEventListener('click', function(){
      speakKorean(tooltipEl.querySelector('.wt-word').textContent);
    });
    return tooltipEl;
  }
  function hideTooltip(){ if (tooltipEl) tooltipEl.classList.remove('open'); }
  function positionTooltip(rect){
    var el = ensureTooltip();
    var top = window.scrollY + rect.bottom + 8;
    var left = window.scrollX + rect.left;
    var maxLeft = window.scrollX + document.documentElement.clientWidth - el.offsetWidth - 16;
    if (left > maxLeft) left = Math.max(12, maxLeft);
    if (left < 12) left = 12;
    el.style.top = top + 'px';
    el.style.left = left + 'px';
  }
  function vocabKey(word){ return 'vocab/' + encodeURIComponent(word); }
  function renderExtra(el, entry){
    var parts = [];
    if (entry.verses && entry.verses.length){
      parts.push('<div class="wt-verses"><b>\ud83d\udcd6 관련 구절</b> ' + entry.verses.map(function(v){
        return String(v).replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
      }).join(', ') + '</div>');
    }
    if (entry.related && entry.related.length){
      var rows = entry.related.map(function(r2){
        var w = String(r2.word||'').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
        var n = String(r2.nuance||'').replace(/[<>&]/g, function(c){ return c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&amp;'; });
        return '<div>· <b>' + w + '</b>' + (n ? ' — ' + n : '') + '</div>';
      }).join('');
      parts.push('<div class="wt-related"><b>\ud83d\udd17 비슷한 단어</b>' + rows + '</div>');
    }
    el.innerHTML = parts.join('');
  }
  function lookupWord(word){
    return VOCAB_DB_PROMISE.then(function(db){
      if (!db) return { db: null, hit: null };
      return db.doc(vocabKey(word)).get().then(function(snap){
        return { db: db, hit: (snap && snap.exists) ? snap.data() : null };
      }).catch(function(){ return { db: db, hit: null }; });
    }).then(function(r){
      if (r.hit) return Object.assign({ cached: true }, r.hit);
      return SAMPLE_PROMISE.then(function(sample){
        if (!sample) return null;
        return sample.json(
          '아래 한국어 단어 또는 구절을 성경 본문에서 만났다. 다음 JSON 형식으로만 답해라(다른 설명 없이):\n' +
          '{"definition": "2~3문장의 기본 뜻, 신앙·성경 맥락 고려, 인사말 없이", "verses": ["책 장:절", "책 장:절"], "related": [{"word": "비슷한 뜻이지만 뉘앙스가 다른 단어", "nuance": "그 차이를 1문장으로"}]}\n' +
          'verses는 이 단어와 실제로 관련 있는 성경 구절 참조 1~3개 (예: "사도행전 16:31-34"). 원어(히브리어/헬라어)나 번역에 따라 뜻이 갈리는 지점이 있으면 definition이나 nuance에 녹여라. related는 뜻은 비슷하지만 결이 다른 단어 0~3개, 없으면 빈 배열.\n\n단어: ' + word,
          { modelTier: 'quick' }
        ).then(function(data){
          var definition = String((data && data.definition) || '').trim();
          var verses = Array.isArray(data && data.verses) ? data.verses.filter(Boolean).map(String) : [];
          var related = Array.isArray(data && data.related)
            ? data.related.filter(function(r2){ return r2 && r2.word; }).map(function(r2){ return { word: String(r2.word), nuance: String(r2.nuance || '') }; })
            : [];
          var entry = { word: word, definition: definition, verses: verses, related: related, createdAt: Date.now(), box: 1, nextReview: Date.now() };
          if (r.db){ r.db.doc(vocabKey(word)).set(entry).catch(function(){}); }
          return Object.assign({ cached: false }, entry);
        });
      });
    });
  }
  function isInsideFormField(node){
    var el = node && node.nodeType === 1 ? node : (node ? node.parentElement : null);
    return !!(el && el.closest && el.closest('textarea, input'));
  }
  var pending = 0;
  function handleSelection(){
    var sel = window.getSelection();
    var text = sel && sel.toString().trim();
    if (!text || text.length < 1 || text.length > 30 || text.indexOf('\n') !== -1){ hideTooltip(); return; }
    if (!sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (isInsideFormField(range.commonAncestorContainer)){ hideTooltip(); return; }
    var rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    var el = ensureTooltip();
    el.querySelector('.wt-word').textContent = text;
    el.querySelector('.wt-body').textContent = '뜻을 찾는 중...';
    el.querySelector('.wt-extra').innerHTML = '';
    var badge = el.querySelector('.wt-badge');
    badge.hidden = true;
    el.classList.add('open');
    positionTooltip(rect);

    var myTicket = ++pending;
    lookupWord(text).then(function(result){
      if (myTicket !== pending) return;
      if (!result){
        el.querySelector('.wt-body').textContent = '이 기능은 Claude 아티팩트 화면에서만 동작해요.';
        return;
      }
      el.querySelector('.wt-body').textContent = result.definition;
      renderExtra(el.querySelector('.wt-extra'), result);
      badge.hidden = false;
      badge.className = 'wt-badge' + (result.cached ? ' cached' : '');
      badge.textContent = result.cached ? '\u26a1 단어장에서 바로 불러왔어요 (무료)' : '\u2713 단어장에 저장했어요';
    }).catch(function(){
      if (myTicket !== pending) return;
      el.querySelector('.wt-body').textContent = '뜻을 가져오지 못했어요.';
    });
  }
  document.addEventListener('mouseup', function(e){
    if (e.target && e.target.closest && e.target.closest('.word-tooltip')) return;
    setTimeout(handleSelection, 10);
  });
  document.addEventListener('mousedown', function(e){
    if (!(e.target && e.target.closest && e.target.closest('.word-tooltip'))) hideTooltip();
  });
  document.addEventListener('scroll', hideTooltip, true);
})();
</script>

</body></html>
